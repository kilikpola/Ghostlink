apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def nodeModulesDir = gradle.ext.nodeModulesDir

// Reanimated cannot find the hoisted react-native by walking up; point it there.
project.ext.REACT_NATIVE_NODE_MODULES_DIR = new File(nodeModulesDir, "react-native").absolutePath

react {
    // Point every path at the hoisted node_modules rather than the default ../.
    root = file("../../")
    reactNativeDir = file("${nodeModulesDir}/react-native")
    codegenDir = file("${nodeModulesDir}/@react-native/codegen")
    cliFile = file("${nodeModulesDir}/react-native/cli.js")
    // The default is resolved relative to `root` as
    // node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc, which misses the
    // hoisted layout. Point at the real binary for this host.
    hermesCommand = new File(nodeModulesDir, "react-native/sdks/hermesc/%OS-BIN%/hermesc").absolutePath
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/** The JavaScriptCore flavor ('org.webkit:android-jsc-intl:+' adds ICU, ~6MiB/ABI). */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "io.ghostlink.app"
    defaultConfig {
        applicationId "io.ghostlink.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode is what upgrades compare; increment it on every release
        // build and never reuse a number. It moves independently of versionName.
        versionCode 8
        versionName "0.0.3"

        // Opt-in ABI filtering for a phone-sized APK:
        //
        //   ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a
        //
        // abiFilters also drops prebuilt .so files from dependencies. Without
        // the property the build stays universal.
        if (project.hasProperty("reactNativeArchitectures")) {
            ndk {
                abiFilters.clear()
                abiFilters.addAll(project.property("reactNativeArchitectures").split(",").collect { it.trim() })
            }
        }
    }
    // Release credentials come from android/keystore.properties (not in version
    // control). A release build without them fails rather than using the
    // public debug key.
    def keystorePropsFile = rootProject.file(project.findProperty("ghostlinkKeystoreProps") ?: "keystore.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// Refuse any release task when the release key is not configured. Checked when
// the task graph is known, so debug builds and IDE sync still work without
// keystore.properties.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }
    if (!wantsRelease) return
    def propsFile = rootProject.file(project.findProperty("ghostlinkKeystoreProps") ?: "keystore.properties")
    if (!propsFile.exists()) {
        throw new GradleException("Release build refused: android/keystore.properties is missing. " +
            "A release must be signed with the GhostLink release key, never the public debug key. See android/KEYSTORE.md.")
    }
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { k ->
        if (!props[k]) {
            throw new GradleException("Release build refused: '${k}' is not set in android/keystore.properties.")
        }
    }
    if (!file(props['storeFile']).exists()) {
        throw new GradleException("Release build refused: release keystore '${props['storeFile']}' not found in android/app/.")
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:flipper-integration")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("${gradle.ext.nodeModulesDir}/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
