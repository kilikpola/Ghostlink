  // Step 1: validate seed + derive key, try localStorage first, else advance to fragments
  const validateAndDeriveKey = async () => {
    // Lowercased before deriving: the phrase was generated and wrapped in
    // lowercase, so an autocapitalised or pasted-with-caps entry would derive a
    // different key and report a wrong seed for correct words.
    const words = verifyInput.trim().toLowerCase().split(/\s+/);
    if (words.length !== 12) {setRestoreStatus("error");return;}
    setRestoreStatus("loading");
    try {
      const masterKey = await CryptoEngine.deriveKeyFromSeed(words);
      setSeedPhrase(words);
      if (window.ghostlink?.isElectron) {
        try {
          await window.ghostlink.gmp.start(words.join(" "));
        } catch (err) {
          console.error('[GMP Setup] Failed to save seed to Electron store:', err);
        }
      }
      const saved = localStorage.getItem("gl_identity");
      if (saved) {
        const d = JSON.parse(saved);
        const wk = d.wrappedPrivKey || d.wrappedKey; // backward compat
        try {
          const privKey = await CryptoEngine.unwrapPrivKey(wk, masterKey);
          setSeedPhrase(words);
          // unwrapPrivKey succeeding proves this phrase belongs to this install,
          // so it is safe to derive the history key from it.
          await unlockHistoryVault(words);
          const fragMeta = localStorage.getItem("gl_fragment_meta");
          // Reconstruct fragment objects from metadata (no data, just display info)
          setIdentity({ keyPair: { privateKey: privKey }, publicKeyHex: d.pubKeyHex || d.publicKeyHex, fingerprint: d.fingerprint, name: d.name });
          setRestoreStatus("ok");
          setTimeout(() => {setShowRecovery(false);setView("main");}, 1500);
          return;
        } catch {/* wrong seed for this localStorage — fall through to fragments */}
      }
      // No localStorage or wrong seed — need fragments
      setMasterKeyTemp(masterKey);
      setRestoreStep("fragments");
      setRestoreStatus(null);
    } catch {setRestoreStatus("wrongseed");}
  };

  // Step 2: combine ≥3 fragments + finalize restore
  const combineAndRestoreIdentity = async () => {
    const validFrags = fragmentInputs.map((f) => f.trim()).filter((f) => f.length > 10);
    if (validFrags.length < 3) {setCombineStatus("need3");return;}
    setCombineStatus("loading");
    try {
      const result = await combineAndRestore(masterKeyTemp, validFrags);
      if (!result.success) {setCombineStatus(result.error);return;}
      // Lowercased before deriving: the phrase was generated and wrapped in
    // lowercase, so an autocapitalised or pasted-with-caps entry would derive a
    // different key and report a wrong seed for correct words.
    const words = verifyInput.trim().toLowerCase().split(/\s+/);
      setSeedPhrase(words);
      setIdentity(result.identity);
      // Fragment reconstruction + key unwrap succeeded, so this phrase is proven
      // for this identity: seal the recovered history under it rather than
      // leaving it on disk in the clear.
      const sealed = await restoreHistoryVault(words, result.recovered);
      if (!sealed) {

  // `target` pins the recipient ({ peerId, convoKey }) for sends that happen
  // after the user may have switched conversations.
  const sendMessage = async (content, type = "text", meta = {}, target = null) => {
    if (sending) return;
    if (!content?.trim() && type === "text") return;
    setSending(true);
    try {
      if (replyTo) meta.replyTo = { index: replyTo.index, sender: replyTo.sender, preview: replyTo.content?.slice(0, 60) };
      if (selfDestruct > 0) meta.selfDestruct = selfDestruct;

      // A targeted send is addressed to one peer and must never be diverted into
      // whatever workspace happens to be open.
      if (isWorkspace && !target) {
        const ns = window.GLLicenseRuntime;
        if (!ns || !ns.workspaceManager || !activeWorkspace) return;
        const enc = await CryptoEngine.encrypt(content.trim(), activeWorkspace.workspaceKey);
        const block = {
          sender: identity.name,
          senderId: identity.fingerprint,
          encrypted: enc,
          type: type,
          meta: meta,
          ts: Date.now()
        };
        await ns.workspaceManager.addToChain(activeWorkspace.id, block);
        setWorkspaces(ns.workspaceManager.getWorkspaces());
        setMsgInput("");
        setReplyTo(null);

        // Broadcast to other workspace members, translating each roster
        // fingerprint to the NodeID the transport can actually reach.
        const conn = p2pConnectorRef.current;
        activeWorkspace.members.forEach((member) => {
          if (member.id !== identity.fingerprint) {
            const nodeId = nodeIdForMember(member.id);
            if (!nodeId) return;
            if (conn && (conn.isConnected(nodeId) || connectionStates[nodeId] === 'connected')) {
              try {
                conn.sendMessage(nodeId, {
                  type: 'workspace-chat',
                  workspaceId: activeWorkspace.id,
                  sender: identity.name,
                  senderId: identity.fingerprint,
                  encrypted: enc,
                  msgType: type,
                  meta: meta
                });
              } catch (e) {
                console.error('Failed to send workspace message to peer:', member.id, e);
              }
            }
          }
        });
        return;
      }

      // Resolve the recipient once, up front, and use it for both the local
      // record and the wire send so the two can never disagree.
      const convoKey = target?.convoKey ?? activeConvo;
      const peerId = target?.peerId || peers.find((p) => p.id === convoKey)?.fingerprint || String(convoKey);

      const block = await chain.add(identity.name, content.trim(), type, meta);
      block.encrypted = await CryptoEngine.encrypt(content.trim(), LocalVault.key());
      bumpChain();
      setMessages((prev) => ({ ...prev, [convoKey]: [...(prev[convoKey] || []), block] }));
      if (!target) {
        setMsgInput("");
        setReplyTo(null);
      }
      setChainValid(await chain.verify());

      if (meta.selfDestruct) {
        scheduleSelfDestruct(block.hash, meta.selfDestruct, block.ts);
      }

      // Send via P2P if connected — try data channel first
      const conn = p2pConnectorRef.current;
      const dcConnected = conn?.isConnected?.(peerId) || false;

      addToast(`Block #${block.index} attached to chain and verified`, 'success');

      // Nothing is transmitted unless sealed to the recipient's public key.
      // Every path out of here either transmits or marks the message failed.
      const markSendFailed = (reason) => {
        addToast(reason, 'error');
        setMessages((prev) => ({
          ...prev,
          [convoKey]: (prev[convoKey] || []).map((m) =>
          m.hash === block.hash ? { ...m, sendFailed: true, sendFailedReason: reason } : m
          )
        }));
      };

      // An offline peer with the Ghost Mesh bridge up goes to its mailbox
      //: sealed exactly as a live message, deposited, and marked
      // 'storing' until the storage host acknowledges it. Without the bridge
      // there is no mailbox, and the failure is stated.
      const offline = !conn || !dcConnected;
      if (offline && !(conn && conn.wsOpen && conn.sendStored)) {
        markSendFailed('Not sent: this peer is offline and the Ghost Mesh bridge is not running, so there is no mailbox to leave it in.');
        return;
      }

      let sealed = null;
      const peerPubKey = getPeerPublicKey(peerId);
      if (peerPubKey) {
        try {
          sealed = await sealPayload({
            type: 'chat', content: content.trim(), msgType: type, meta,
            sender: identity.name, ts: Date.now()
          }, peerPubKey);
        } catch (e) {
          console.error('Failed to seal message for peer:', peerId, e);
        }
      }
      if (!sealed) {
        markSendFailed('Not sent: no usable public key for this peer — reconnect or re-scan their invite');
        return;
      }

      if (offline) {
        setMessages((prev) => ({
          ...prev,
          [convoKey]: (prev[convoKey] || []).map((m) => m.hash === block.hash ? { ...m, deliveryState: 'storing' } : m)
        }));
        if (!conn.sendStored(peerId, block.hash, { type: 'queued-message', sender: identity.name, sealed, blockHash: block.hash })) {
          markSendFailed('Not sent: the Ghost Mesh bridge dropped before the message could be stored.');
        }
        return;
      }

      try {
        conn.sendMessage(peerId, {
          type: 'chat', sender: identity.name, sealed, blockHash: block.hash
        });
        conn.sendPresence(peerId, { type: 'typing', sender: identity.name });
      } catch (e) {
        // This was a bare console.error. A throw here means the data channel
        // refused the write, which is exactly a failed send.
        console.error('DC send failed:', e);
        markSendFailed('Not sent: the connection to this peer dropped mid-send.');
      }
    } catch (e) {console.error('sendMessage error:', e);addToast(e.message || 'Failed to send message', 'error');} finally
    {
      setSending(false);
    }
  };

  const sendFile = async (fileName, fileSize, fileObj, targetPeerId = null) => {
    const runtime = window.GLLicenseRuntime;
    if (runtime && runtime.featureGate) {
      const limits = await runtime.featureGate.getLimits();
      const maxBytes = limits.maxTransferBytes;
      const maxAllowed = maxBytes === Infinity ? 2 * 1024 * 1024 * 1024 : maxBytes;
      if (fileSize > maxAllowed) {
        await runtime.featureGate.triggerUpgradeFlow('transfer');
        addToast(`File size exceeds limit (${maxBytes === Infinity ? '2GB' : '25MB'})`, 'error');
        return;
      }
    }
    try {
      const id = Date.now();
      setUploadProgress((p) => ({ ...p, [id]: 0 }));

      const peerId = targetPeerId || peers.find((p) => p.id === activeConvo)?.fingerprint || String(activeConvo);
      const conn = p2pConnectorRef.current;
      const dcConnected = conn?.isConnected?.(peerId) || connectionStates[peerId] === 'connected';

      // Real P2P file transfer if connected
      const ftm = fileTransferManagerRef.current || fileTransferManager;
      if (ftm && fileObj && dcConnected) {
        try {
          await ftm.sendFile(peerId, fileObj);
          const fHash = (await CryptoEngine.sha256(fileName + fileSize)).slice(0, 12);
          const fChunks = Math.ceil(fileSize / 65536);
          // The bytes went to peerId; the metadata has to follow the same peer.
          // A pending-transfer flush runs long after the user picked the file,
          // so activeConvo may well be someone else's conversation by now.
          const fileConvoKey = peers.find((p) => p.fingerprint === peerId || p.id === peerId)?.id ?? peerId;
          await sendMessage(fileName, "file", { fileSize, chunks: fChunks, hash: fHash }, { peerId, convoKey: fileConvoKey });
          setTransferredFiles((prev) => [...prev, { name: fileName, size: fileSize, from: identity?.name || 'You', ts: Date.now(), hash: fHash + '...', chunks: fChunks, encrypted: true, url: URL.createObjectURL(fileObj) }]);
          setUploadProgress((p) => {const n = { ...p };delete n[id];return n;});
          return;
        } catch (e) {console.error('P2P file transfer failed:', e);addToast('File transfer failed: ' + e.message, 'error');}
      }

      // AWAIT MODE: Peer offline, queue for connection
      if (!targetPeerId) {
        setPendingFileTransfers((prev) => ({
          ...prev,
          [peerId]: [...(prev[peerId] || []), { id, name: fileName, size: fileSize, fileObj }]
        }));
        addToast(`Recipient offline — file queued to send when they connect`, 'info');

        // Fallback: local-only file record (visual only until connected)
        const chunks = Math.ceil(fileSize / 65536);
        const fileHash = (await CryptoEngine.sha256(fileName + fileSize)).slice(0, 12);
        const block = await chain.add(identity.name, fileName, "file", { fileSize, chunks, hash: fileHash, status: 'awaiting' });
        bumpChain();
        setMessages((prev) => ({ ...prev, [activeConvo]: [...(prev[activeConvo] || []), block] }));
        setTransferredFiles((prev) => [...prev, { name: fileName, size: fileSize, from: identity?.name || 'You', ts: Date.now(), hash: fileHash + '...', chunks, encrypted: true }]);
        setUploadProgress((p) => {const n = { ...p };delete n[id];return n;});
      } else {
        // Reached only when a targeted send (a pending-transfer flush) could not
        // go out. Put it back on the queue instead of dropping it silently.
        setPendingFileTransfers((prev) => ({
          ...prev,
          [peerId]: [...(prev[peerId] || []), { id, name: fileName, size: fileSize, fileObj }]
        }));
        setUploadProgress((p) => {const n = { ...p };delete n[id];return n;});
        addToast(`Could not send ${fileName} — re-queued for the next connection`, 'warning');
      }
    } catch (e) {console.error('sendFile error:', e);addToast(e.message || 'Failed to send file', 'error');}
  };

  const sendImage = async (file) => {

  const generateSeedPhrase = async () => {
    if (!BIP39_WORDS) {
      try {
        const bip39Module = await import('./src/utils/bip39.js');
        BIP39_WORDS = bip39Module.BIP39_WORDS;
      } catch (e) {
        console.error('[Identity] Failed to load BIP39 wordlist:', e.message);
        throw new Error('Cannot generate seed phrase: wordlist failed to load. Please refresh the page.');
      }
    }
    if (!BIP39_WORDS) {
      throw new Error('Cannot generate seed phrase: wordlist not available.');
    }
    const entropy = crypto.getRandomValues(new Uint8Array(16));
    const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', entropy));
    const bits = [];
    for (let i = 0; i < 16; i++) for (let b = 7; b >= 0; b--) bits.push(entropy[i] >> b & 1);
    for (let i = 0; i < 4; i++) bits.push(hash[i >> 3] >> 7 - (i & 7) & 1);
    const words = [];
    for (let i = 0; i < 12; i++) {
      let idx = 0;
      for (let j = 0; j < 11; j++) idx = idx << 1 | bits[i * 11 + j];
      words.push(BIP39_WORDS[idx]);
    }
    return words;
  };

  const startCall = async (type) => {
    try {
      const isSecure = window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (!isSecure) {

        return;
      }

      // Get local media stream. A 'screen' call uses getDisplayMedia, with
      // audio captured alongside.

      let screenTrack = null;
      try {
        if (type === 'screen') {
          const displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
          screenTrack = displayStream.getVideoTracks()[0];
          let micTrack = null;
          try {
            const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            micTrack = micStream.getAudioTracks()[0];
          } catch (micErr) {

        }

        setLocalStream(localStream);
      } catch (err) {

        } else if (err.name === 'NotFoundError') {

        } else {
          addToast('Could not access media: ' + err.message, 'error');
        }

      }

      // Create a new RTCPeerConnection for this call
      const callConfig = {

        }
      } else

      if (data.type === 'ice-candidate') {
        const pc = quickPcRef.current;
        if (pc) {
          if (pc.remoteDescription) {
            try {await pc.addIceCandidate(data.candidate);} catch (e) {}
          } else {
            if (!pc.__pendingCandidates) pc.__pendingCandidates = [];
            pc.__pendingCandidates.push(data.candidate);
          }
        }
      }
    };
  };

  // Join Flow
  const startQuickJoin = async () => {
    if (!quickInputCode.trim() || !identity || !p2pConnectorRef.current) return;
    const code = quickInputCode.trim().toUpperCase();
    if (code.length !== 6) {
      addToast('Room code must be exactly 6 characters', 'error');
      return;
    }

    closeQuickConnect();
    setQuickMode('join');
    setQuickSignalStep('join-connecting');

    const url = getFormattedRelayUrl();
    if (!url) {
      addToast('Relay server URL is not configured in settings', 'error');
      setQuickSignalStep('idle');
      return;
    }

    let ws;
    try {
      ws = new WebSocket(url);
      quickWsRef.current = ws;
    } catch (e) {
      console.error('Failed to create websocket:', e);
      addToast('Failed to connect to relay: ' + e.message, 'error');
      setQuickSignalStep('failed');
      return;
    }

    const fallbackTimeout = setTimeout(() => {
      if (ws.readyState !== WebSocket.OPEN) {
        try {ws.close();} catch (e) {}
        addToast("Relay unreachable. Use your Ghost Address to connect instead.", "warning");
        setInviteTab("create");
        closeQuickConnect();
      }
    }, 5000);

    ws.onopen = () => {
      clearTimeout(fallbackTimeout);
      ws.send(JSON.stringify({ type: 'join-room', roomCode: code }));
      setQuickSignalStep('join-handshaking');
      setConnectionMode('Via Relay');
    };

    ws.onerror = (err) => {
      console.error('Relay WebSocket error:', err);
      addToast('Lost the connection to the signaling relay — check the relay URL in Settings and try again', 'error');
      setQuickSignalStep('failed');
    };

    ws.onclose = () => {
      console.debug("Relay connection closed");
    };

    ws.onmessage = async (evt) => {
      let data;
      try {data = JSON.parse(evt.data);} catch {return;}

      const conn = p2pConnectorRef.current;
      if (!conn) return;

      if (data.type === 'error') {
        addToast(data.message, 'error');
        setQuickSignalStep('failed');
        return;
      }

      if (data.type === 'offer') {
        if (!(await quickPeerClaimAcceptable(conn, data))) {
          addToast('Rejected a peer whose identity did not match its key', 'error');
          setQuickSignalStep('failed');
          return;
        }
        const pc = new RTCPeerConnection({
          iceServers: getIceServers()
        });
        quickPcRef.current = pc;
        pc.__mode = 'P2P Direct';

        pc.__remoteFingerprint = data.fingerprint;
        pc.__remoteName = data.name;
        pc.__remotePubKey = data.pubKeyHex;

        const peerId = data.fingerprint;
        conn.pcs[peerId] = pc;
        conn.knownPeers[peerId] = { name: data.name, publicKey: data.pubKeyHex };

        const dcs = { messages: null, files: null, presence: null };
        quickDcsRef.current = dcs;

        pc.ondatachannel = (event) => {
          const label = event.channel.label;
          if (label === 'messages' || label === 'files' || label === 'presence') {
            dcs[label] = event.channel;
            conn._setupDc(peerId, label, event.channel);
          }
        };

        pc.onicecandidate = (event) => {
          if (event.candidate && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
              type: 'ice-candidate',
              roomCode: code,
              candidate: event.candidate
            }));
          }
        };

        pc.onconnectionstatechange = () => {
          const state = pc.connectionState;
          if (state === 'connected') {
            if (quickWsRef.current) {
              try {quickWsRef.current.close();} catch (e) {}
              quickWsRef.current = null;
            }
          } else if (state === 'failed') {
            setQuickSignalStep('failed');
            setConnectionMode('Connection Failed');
          }
        };

        // Set remote offer
        await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: data.sdp }));

        // Process pending candidates
        if (pc.__pendingCandidates) {
          for (const candidate of pc.__pendingCandidates) {
            try {await pc.addIceCandidate(candidate);} catch (e) {}
          }
          delete pc.__pendingCandidates;
        }

        // Create answer
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        ws.send(JSON.stringify({
          type: 'answer',
          roomCode: code,
          sdp: answer.sdp,
          pubKeyHex: identity.publicKeyHex,
          name: identity.name,
          fingerprint: identity.fingerprint
        }));
      } else

      if (data.type === 'ice-candidate') {
        const pc = quickPcRef.current;
        if (pc) {
          if (pc.remoteDescription) {
            try {await pc.addIceCandidate(data.candidate);} catch (e) {}
          } else {
            if (!pc.__pendingCandidates) pc.__pendingCandidates = [];
            pc.__pendingCandidates.push(data.candidate);
          }
        }
      }
    };
  };

  useEffect(() => {
    const conn = p2pConnectorRef.current;
    if (!conn) return;

    const handlePeerConnected = (peerId) => {
      if (quickSignalStep === 'host-handshaking' || quickSignalStep === 'join-handshaking' || quickSignalStep === 'host-waiting') {
        setQuickSignalStep('connected');
        if (quickWsRef.current) {
          try {quickWsRef.current.close();} catch (e) {}
          quickWsRef.current = null;
        }
      }
    };

    conn.on('peer-connected', handlePeerConnected);
    return () => {
      conn.off('peer-connected', handlePeerConnected);
    };
  }, [quickSignalStep]);

  useEffect(() => {
    return () => {
      if (quickWsRef.current) {
        try {quickWsRef.current.close();} catch (e) {}
      }
      if (quickPcRef.current) {
        try {quickPcRef.current.close();} catch (e) {}
      }
    };
  }, []);

  // ═══════════════════════════════════════════════════════════════
  // PLANNED FEATURE IMPLEMENTATIONS
  // ═══════════════════════════════════════════════════════════════

  // ---- TURN Server Config ----
  // Only the non-secret part is persisted. Credentials live in memory for the
  // session and are re-entered after a reload.
  useEffect(() => {
    const saved = localStorage.getItem('gl_turn_servers');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) {
          setTurnServers(parsed.map((s) => ({ url: s?.url || '', username: '', credential: '' })));
        }
      } catch {}
    }
    setTurnFallbackEnabled(localStorage.getItem('gl_turn_fallback') === 'true');
  }, []);

  const saveTurnServers = (servers) => {
    setTurnServers(servers);
    // Persist the URL only. Usernames and credentials stay in React state.
    localStorage.setItem('gl_turn_servers', JSON.stringify(servers.map((s) => ({ url: s.url || '' }))));
  };

  // getIceServers() is module scope and cannot read React state, so mirror the
  // credential-bearing list out to it. Covers both the load effect above and
  // every edit in the settings UI.
  useEffect(() => {
    setSessionTurnServers(turnServers);
  }, [turnServers]);

  const toggleTurnFallback = (enabled) => {
    setTurnFallbackEnabled(enabled);
    localStorage.setItem('gl_turn_fallback', String(enabled));
  };

  // ---- Contact Verification Ceremony (Safety Numbers) ----
  // SHA-256 over the sorted public-key pair, shown as 160 bits in 10 groups of
  // 4 hex.
  const generateSafetyNumber = async (peerPubKeyHex, myPubKeyHex) => {
    const sorted = [String(peerPubKeyHex), String(myPubKeyHex)].sort();
    const material = new TextEncoder().encode('ghostlink-safety-number-v1|' + sorted.join('|'));
    const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', material));
    const hex = Array.from(digest.slice(0, 20)).
    map((b) => b.toString(16).padStart(2, "0")).join("").toUpperCase();
    return (hex.match(/.{4}/g) || []).join(' ');
  };

  const openVerificationCeremony = async (peer) => {
    setVerificationPeer(peer);
    setSafetyNumber('');
    setShowVerificationCeremony(true);
    // Only a real public key produces a meaningful number. Falling back to the
    // fingerprint would render a confident-looking value that verifies nothing.
    const peerPubKey = peer && (peer.pubKey || getPeerPublicKey(peer.fingerprint || peer.id));
    if (!identity?.publicKeyHex || !peerPubKey) return;
    try {
      setSafetyNumber(await generateSafetyNumber(peerPubKey, identity.publicKeyHex));
    } catch (e) {
      console.error('Safety number derivation failed:', e);
    }
  };

  // A contact counts as verified only against the exact public key the user
  // compared. If the peer later presents a different key, the badge clears
  // rather than vouching for a key nobody checked.
  const isPeerVerified = useCallback((peer) => {
    if (!peer) return false;
    const recorded = verificationComplete[peer.id];
    if (!recorded) return false;
    const current = peer.pubKey || getPeerPublicKey(peer.fingerprint || peer.id);
    return !!current && recorded === current;
  }, [verificationComplete, getPeerPublicKey]);

  const confirmVerification = () => {
    if (!verificationPeer) return;
    const verifiedKey = verificationPeer.pubKey ||
    getPeerPublicKey(verificationPeer.fingerprint || verificationPeer.id);
    if (!verifiedKey) {
      addToast('Cannot mark verified — no public key for this contact', 'error');
      return;
    }
    setVerificationComplete((prev) => {
      const next = { ...prev, [verificationPeer.id]: verifiedKey };
      savePersisted(VERIFIED_STORAGE_KEY, next);
      return next;
    });
    addToast(`Contact ${verificationPeer.name} verified`, 'success');
    setShowVerificationCeremony(false);
  };

  // ---- Message Reactions ----
  const addReaction = (messageHash, emoji) => {
    setMessageReactions((prev) => {
      const existing = prev[messageHash] || {};
      const reactors = existing[emoji] || [];
      const myId = identity?.fingerprint || 'me';
      // Toggle: remove if already reacted, add if not
      const newReactors = reactors.includes(myId) ?
      reactors.filter((r) => r !== myId) :
      [...reactors, myId];
      const newReactions = { ...existing, [emoji]: newReactors };
      // Clean up empty arrays
      if (newReactors.length === 0) delete newReactions[emoji];
      return { ...prev, [messageHash]: newReactions };
    });
    setShowReactionPicker(null);

    // Reactions are sealed like chat: in the clear they leak who is talking
    // about what.
    const peerId = peers.find((p) => p.id === activeConvo)?.fingerprint || String(activeConvo);
    if (peerManager) {
      (async () => {
        try {
          const peerPubKey = getPeerPublicKey(peerId);
          if (!peerPubKey) {
            console.warn('[reaction] no public key for', peerId, '— not sending in the clear');
            return;
          }
          // Name the message by the hash the peer holds for it (see the
          // receive side): its own hash for a message it sent us, ours otherwise.
          const block = chain.blocks.find((b) => b.hash === messageHash);
          const sealed = await sealPayload(
            { type: 'reaction', messageHash: block?.remoteHash || messageHash, emoji, sender: identity?.name },
            peerPubKey
          );
          await peerManager.sendMessage(peerId, { type: 'reaction', sealed });
        } catch (e) {
          console.error('Reaction send failed:', e);
        }
      })();
    }
  };

  const getReactionSummary = (messageHash) => {
    const reactions = messageReactions[messageHash] || {};
    return Object.entries(reactions).
    map(([emoji, reactors]) => ({ emoji, count: reactors.length })).
    filter((r) => r.count > 0);
  };

  // Incoming reactions are unsealed by the conn.on('message') handler in the
  // P2P effect; do not add a second, plaintext-accepting listener.

  // ---- Voice Messages with Waveform ----
  const startRecording = async () => {
    try {
      if (!window.isSecureContext && window.location.hostname !== 'localhost') {
        addToast('Microphone requires HTTPS or localhost', 'error');
        return;
      }
      if (!navigator.mediaDevices) {
        addToast('Microphone not available', 'error');
        return;
      }
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/ogg';
      const recorder = new MediaRecorder(stream, { mimeType });
      const chunks = [];
      const waveformData = [];

      // Setup audio analysis for waveform
      if (audioContextRef.current) audioContextRef.current.close();
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      audioContextRef.current = audioContext;
      const source = audioContext.createMediaStreamSource(stream);
      const analyser = audioContext.createAnalyser();
      analyser.fftSize = 64;
      source.connect(analyser);
      const dataArray = new Uint8Array(analyser.frequencyBinCount);

      const waveformInterval = setInterval(() => {
        analyser.getByteFrequencyData(dataArray);
        const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
        waveformData.push(avg / 255);
        setRecordingWaveform([...waveformData]);
      }, 50);

      recorder.ondataavailable = (e) => {if (e.data.size > 0) chunks.push(e.data);};
      recorder.onstop = async () => {
        clearInterval(waveformInterval);
        clearInterval(recordingTimerRef.current);
        audioContext.close();
        const blob = new Blob(chunks, { type: mimeType });
        const elapsedMs = recordingStartRef.current ? Date.now() - recordingStartRef.current : 0;
        recordingStartRef.current = null;
        // Round up: a genuine sub-second clip is still a clip, and must not
        // round down to a duration the send path treats as "nothing recorded".
        const duration = elapsedMs > 0 ? Math.max(1, Math.round(elapsedMs / 1000)) : 0;

        if (elapsedMs < 250) {
          if (elapsedMs > 0) addToast('Recording too short', 'info');
        } else {
          const msgId = 'voice-' + Date.now();
          // Build local preview
          const localUrl = URL.createObjectURL(blob);
          setVoiceMessages((prev) => ({
            ...prev,
            [activeConvo]: [...(prev[activeConvo] || []), {
              id: msgId, url: localUrl, duration, waveform: [...waveformData],
              ts: Date.now(), sender: identity?.name
            }]
          }));

          // Send real voice data via P2P — convert blob to base64
          const peerId = peers.find((p) => p.id === activeConvo)?.fingerprint || String(activeConvo);
          const arrayBuffer = await blob.arrayBuffer();
          const binaryString = Array.from(new Uint8Array(arrayBuffer)).map((b) => String.fromCharCode(b)).join('');
          const base64Audio = btoa(binaryString);
          const conn = p2pConnectorRef.current;
          const payload = {
            type: 'voice', audioData: base64Audio, mimeType,
            duration, waveform: [...waveformData],
            sender: identity?.name, ts: Date.now()
          };

          if (conn && conn.isConnected(peerId)) {
            // Seal before sending: GMPBridgeConnector.sendMessage falls back to
            // the bridge WebSocket when no direct data channel is open, so a
            // plaintext payload would expose the recording to the bridge.
            try {
              const peerPubKey = getPeerPublicKey(peerId);
              if (!peerPubKey) {
                addToast('Not sent: no usable public key for this peer', 'error');
              } else {
                conn.sendMessage(peerId, {
                  type: 'chat', sealed: await sealPayload(payload, peerPubKey)
                });
              }
            } catch (e) {console.error('Voice send failed:', e);addToast('Voice message could not be sent — check your connection and try again', 'error');}
          } else {
            // No offline queue exists, so this is the whole of the offline
            // story: the recording is kept locally and the user is told it
            // did not go anywhere.
            addToast('Not connected — voice message saved locally only', 'info');
          }
        }

        stream.getTracks().forEach((t) => t.stop());
        setIsRecording(false);
        setRecordingDuration(0);
        setRecordingWaveform([]);
      };

      recorder.start(100);
      recordingStartRef.current = Date.now();
      mediaRecorderRef.current = recorder;
      setIsRecording(true);
      setRecordingWaveform([]);
      setRecordingDuration(0);

      recordingTimerRef.current = setInterval(() => {
        setRecordingDuration((d) => d + 1);
      }, 1000);
    } catch (e) {
      addToast('Microphone access denied', 'error');
    }
  };

  const stopRecording = () => {
    if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
      mediaRecorderRef.current.stop();
    }
    if (audioContextRef.current) {
      audioContextRef.current.close().catch(() => {});
      audioContextRef.current = null;
    }
  };

  const playVoiceMessage = async (msgId, url) => {
    const audio = new Audio(url);
    audio.play();
    setAudioPlayback({ messageId: msgId, playing: true });

    const progressInterval = setInterval(() => {
      if (audio.duration) {
        setPlaybackProgress((prev) => ({ ...prev, [msgId]: audio.currentTime / audio.duration }));
      }
    }, 100);

    audio.onended = () => {
      clearInterval(progressInterval);
      setAudioPlayback({ messageId: null, playing: false });
      setPlaybackProgress((prev) => ({ ...prev, [msgId]: 0 }));
    };
  };

  // Handle incoming fragments
  const createGroup = () => {
    if (!groupName.trim() || selectedGroupPeers.length < 2) {
      addToast('Need a name and at least 2 peers', 'error');
      return;
    }
    const group = {
      id: 'group-' + Date.now(),
      name: groupName.trim(),
      members: selectedGroupPeers,
      type: 'group'
    };
    setActiveGroups((prev) => [...prev, group]);
    setPeers((prev) => [...prev, {
      id: group.id, name: group.name, status: 'online',
      type: 'group', memberCount: selectedGroupPeers.length,
      avatar: 'G', color: th.accent3
    }]);
    setShowGroupCreator(false);
    setGroupName('');
    setSelectedGroupPeers([]);
    addToast(`Group "${group.name}" created`, 'success');
  };

  // ---- Push Notifications ----
  useEffect(() => {
    setPushSupported('Notification' in window && 'serviceWorker' in navigator);
  }, []);

  const requestPushPermission = async () => {
    if (!pushSupported) return;
    try {
      const result = await Notification.requestPermission();
      setPushEnabled(result === 'granted');
      if (result === 'granted') addToast('Push notifications enabled', 'success');
    } catch {
      addToast('Push notifications not available', 'info');
    }
  };

  // Show push notification on new message
  useEffect(() => {
    if (!pushEnabled || !activeConvo) return;
    const lastMsg = messages[activeConvo]?.slice(-1)[0];
    if (lastMsg && lastMsg.sender !== identity?.name && document.hidden) {
      try {
        new Notification('GhostLink - New Message', {
          body: `${lastMsg.sender}: ${lastMsg.content?.slice(0, 60) || ''}`,
          icon: '',
          tag: lastMsg.hash
        });
      } catch {}
    }
  }, [messages, activeConvo, pushEnabled]);

  // ---- Biometric Unlock Check ----
  useEffect(() => {
    if (window.PublicKeyCredential && typeof window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable === 'function') {
      window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().
      then((available) => setBiometricStatus(available ? 'available' : 'unsupported')).
      catch(() => setBiometricStatus('unsupported'));
    }
  }, []);

  // ---- Fragment Distribution via P2P ----
  const guardianRecoveryAvailable = window.GhostLink?.Capabilities?.GUARDIAN_RECOVERY_AVAILABLE === true;
  const guardianRecoveryReason = window.GhostLink?.Capabilities?.GUARDIAN_RECOVERY_UNAVAILABLE_REASON ||
  'Sending recovery fragments to peers is disabled';

  const sendFragmentToPeer = async (fragment, peerId) => {
    // No peer stores a received fragment yet, so a "sent" fragment would be
    // counted toward a backup nobody holds.
    if (!guardianRecoveryAvailable) {
      addToast(guardianRecoveryReason, 'error');
      return;
    }
    if (!peerManager) return;
    const peer = peers.find((p) => p.id === peerId || p.fingerprint === peerId);

    // Recovery fragments (any three rebuild the backup) go only to verified
    // peers, sealed, one share per recipient.
    if (!peer || !isPeerVerified(peer)) {
      addToast('Verify this contact’s safety number before trusting them with a recovery fragment', 'error');
      return;
    }
    const holderId = peer.fingerprint || peer.id;
    const alreadyHolds = (shamirFragments || []).some((f) =>
    f.distributed && f.id !== fragment.id && f.peerId && f.peerId === holderId
    );
    if (alreadyHolds) {
      addToast(`${peer.name} already holds a fragment — send this one to a different peer`, 'error');
      return;
    }

    const peerPubKey = getPeerPublicKey(holderId);
    if (!peerPubKey) {
      addToast('Cannot send fragment: no verified public key for this peer yet', 'error');
      return;
    }

    try {
      const sealed = await sealPayload({
        type: 'fragment', fragmentId: fragment.id, data: fragment.data,
        check: fragment.check, sender: identity?.name
      }, peerPubKey);
      // sendMessage returns false (no throw) when the peer is unknown or has no
      // usable transport — marking the fragment distributed on that would tell
      // the user a share of their key is safely placed when it never left.
      const sent = await peerManager.sendMessage(peerId, { type: 'fragment-sealed', sealed });
      if (!sent) {
        addToast(`Fragment ${fragment.id} not sent — no live connection to ${peer?.name || peerId}. Still pending.`, 'error');
        return;
      }
      markFragmentDistributed(fragment.id, peer?.name || peerId, holderId);
      setShamirFragments((frags) => frags.map((f) =>
      f.id === fragment.id ? { ...f, distributed: true, peerName: peer?.name || peerId, peerId: holderId } : f
      ));
      addToast(`Fragment ${fragment.id} sent to ${peer?.name || peerId}`, 'success');
    } catch (e) {
      console.error('Fragment send failed:', e);
      addToast('Recovery fragment could not be sent — check the connection to that peer and try again', 'error');
    }
  };

  // Handle incoming fragments
  useEffect(() => {
    if (!peerManager) return;
    const handler = async (peerId, data) => {
      try {
        const parsed = typeof data === 'string' ? JSON.parse(data) : data;
        if (parsed.type === 'fragment') {
          // Plaintext fragment: the sender is on an older build, and the
          // fragment has already been exposed to whatever carried it.
          console.warn('[fragment] rejected unsealed recovery fragment from', peerId);
          addToast('Rejected an unencrypted recovery fragment — ask the sender to update', 'warning');
          return;
        }
        if (parsed.type === 'fragment-sealed') {
          // This build does not store fragments for others, so do not open it
          // or tell anyone it arrived: the sender must not believe it is held.
          console.warn('[fragment] ignored recovery fragment from', peerId, '— guardian recovery is disabled');
          addToast('A contact tried to send you a recovery fragment. This version cannot hold fragments — it was not kept.', 'warning');
        }
      } catch (e) {
        console.error('Fragment receive failed:', e);
      }
    };
    peerManager.on('message', handler);
    return () => peerManager.off('message', handler);
  }, [peerManager]);

  // ---- Keyboard Shortcuts ----
  useEffect(() => {
    const handler = (e) => {
      // Ctrl/Cmd + K = search
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        setShowSearch(true);
      }
      // Escape = close modals
      if (e.key === 'Escape') {
        setShowSettings(false);
        setShowRecovery(false);
        setShowRoadmap(false);
        setShowGroupCreator(false);
        setShowVerificationCeremony(false);
        setShowReactionPicker(null);
        setShowTurnConfig(false);
      }
      // Ctrl/Cmd + E = emoji picker
      if ((e.ctrlKey || e.metaKey) && e.key === 'e') {
        e.preventDefault();
        setShowEmojiPicker((prev) => !prev);
      }
      // Ctrl/Cmd + Shift + R = reactions on last message
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'R') {
        e.preventDefault();
        const lastMsg = messages[activeConvo]?.slice(-1)[0];
        if (lastMsg) setShowReactionPicker(lastMsg.hash);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [activeConvo, messages]);

  // ── End of Planned Feature Implementations ──

  // The single app palette. `th` keeps legacy key names used throughout.
  const th = {
    bg: PALETTE.obsidian,          // app background
    bg2: PALETTE.graphite,         // elevated: icon rail, inputs, small buttons
    bg3: PALETTE.slate,            // panels: sidebar, cards, list rows
    accent: PALETTE.spectral,      // secure / verified / connected / send
    accent2: PALETTE.signal,       // links, info, encryption + chain tags
    accent3: PALETTE.signal,       // was purple; the new system has no purple
    text: PALETTE.frost,
    textSecondary: PALETTE.mist,
    icon: PALETTE.frost,
    border: PALETTE.divider,
  };

    a.href = url;
    a.download = buyFileName || 'ghostlink-receipt.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }} style=${
  { width: "100%", padding: "12px", borderRadius: 8, border: `1px solid ${th.accent}`, background: "transparent", color: th.accent, fontSize: 11, fontWeight: 600, cursor: "pointer", outline: "none" }}>
                          📥 Download Payment Screenshot
                        </button>
                        
                        <button onClick=${

  () => {
    const durationStr = buyBilling === 'lifetime' ? 'LIFETIME' : `${buyDuration} ${buyBilling === 'monthly' ? 'MONTHS' : 'YEARS'}`;
    const subject = encodeURIComponent(`GhostLink License Request — ${buyPlan} — ${durationStr}`);
    const body = encodeURIComponent(
      `Plan: ${buyPlan}\n` +
      `Billing: ${buyBilling.toUpperCase()}\n` +
      `Duration: ${buyBilling === 'lifetime' ? 'Lifetime' : buyDuration + ' ' + (buyBilling === 'monthly' ? 'month(s)' : 'year(s)')}\n` +
      `Amount Paid: ${buyCryptoAmount ? `${buyCryptoAmount} ${buyCoin}` : `${buyCoin} — see transaction hash`} (${buyTotalPriceUSD} USD order total)\n` +
      `Transaction Hash: ${buyTxHash}\n` +
      `Device ID: ${deviceId || 'N/A'}\n` +
      `Verification Status: Pending Manual Review\n` +
      `Reference ID: ${buyRefId}\n\n` +
      `[Screenshot attached separately — please attach the downloaded payment screenshot to this email before sending]`
    );
    window.location.href = `mailto:ghostlink@proton.me?subject=${subject}&body=${body}`;
    setBuyStep(8);
  }} style=${
  { width: "100%", padding: "12px", borderRadius: 8, border: "none", background: th.accent, color: PALETTE.obsidian, fontSize: 11, fontWeight: 600, cursor: "pointer", outline: "none" }}>
                          ✉️ Launch Email Client
                        </button>
                      </div>
                    </div>`}

                  
                  ${

  buyStep === 8 && html`<div style=${
  { textAlign: "center", animation: "fadeIn 0.2s ease" }}>
                      <div style=${{ fontSize: 32, marginBottom: 12 }}>📬</div>
                      <div style=${{ fontSize: 15, fontWeight: 800, color: th.accent, marginBottom: 8 }}>Verification Details Sent</div>
                      <div style=${{ fontSize: 11, color: PALETTE.mist, lineHeight: 1.6, marginBottom: 20 }}>
                        We have queued your activation request under Reference ID: <strong style=${{ color: PALETTE.frost, fontFamily: "monospace" }}>${buyRefId}</strong>.<br /><br />
                        Once the transaction has been verified by our team, your activation key will be delivered to: <strong style=${{ color: PALETTE.frost }}>${buyEmail}</strong>.<br /><br />
                        Copy the received license key and paste it directly into the Settings activation input field to unlock your Pro features.
                      </div>
                      
                      <button onClick=${
  () => setShowBuyModal(false)} style=${
  { width: "100%", padding: "12px", borderRadius: 8, border: "none", background: th.accent, color: PALETTE.obsidian, fontSize: 11, fontWeight: 600, cursor: "pointer" }}>
                        [ Close Portal ]
                      </button>
                    </div>`}

                </div>
              </div>`}
          </div>`;




}

createRoot(document.getElementById('root')).render(html`<${ErrorBoundary}><${GhostLinkApp} /><//>`);
    </script>
  </body>
</html>
