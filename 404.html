<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>404 — This Page Left No Trace | GhostLink</title>
<meta name="description" content="The page you were looking for does not exist — or was never here. Head back to GhostLink, the end-to-end encrypted P2P messenger that leaves no trace.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0F17">
<link rel="icon" href="assets/ghostlink-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* GhostLink 404 — same spectral-mint design system as landing.html */
:root{
  --bg:#0B0F17;
  --panel:#151B26;
  --panel-2:#1F2733;
  --line:rgba(79,227,176,.10);
  --line-2:rgba(79,227,176,.20);
  --text:#E8EDF4;
  --mist:#8B95A5;
  --fade:#5A6577;
  --spectral:#4FE3B0;
  --spectral-lit:#8CFFD4;
  --spectral-deep:#2FA37D;
  --grad:linear-gradient(100deg,#8CFFD4 0%,#4FE3B0 48%,#2FA37D 105%);
  --radius:18px;
  --font-d:'Space Grotesk',system-ui,sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font-d);line-height:1.6;
  overflow-x:hidden;min-height:100svh;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(79,227,176,.28);color:#fff}
svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--spectral);outline-offset:3px;border-radius:6px}

main{
  position:relative;flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:60px 20px;overflow:hidden;
}
main::before{
  content:'';position:absolute;inset:0;z-index:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;background-position:center;
  mask-image:radial-gradient(ellipse 75% 65% at 50% 42%,#000 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 75% 65% at 50% 42%,#000 30%,transparent 75%);
}
.inner{position:relative;z-index:2;max-width:640px}
.hero-mark{width:clamp(72px,12vw,104px);margin:0 auto 26px;color:var(--spectral);filter:drop-shadow(0 0 24px rgba(79,227,176,.45));animation:float 5.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.code{
  font-family:var(--font-m);font-size:clamp(56px,12vw,96px);font-weight:700;letter-spacing:2px;line-height:1;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
h1{font-size:clamp(26px,5vw,42px);font-weight:700;letter-spacing:-.5px;margin-top:14px}
.sub{color:var(--mist);font-size:clamp(14px,2vw,16px);max-width:480px;margin:14px auto 0}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--font-m);font-weight:700;font-size:14px;letter-spacing:1px;
  padding:16px 34px;border-radius:99px;min-height:52px;
  transition:transform .35s var(--ease),box-shadow .35s,background .35s,border-color .35s;
}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--grad);color:#04121a;box-shadow:0 6px 24px rgba(79,227,176,.22)}
.btn-primary:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 14px 40px rgba(47,163,125,.4)}
.btn-ghost{border:1px solid var(--line-2);color:var(--text);background:rgba(255,255,255,.02)}
.btn-ghost:hover{transform:translateY(-3px);border-color:var(--spectral);background:rgba(79,227,176,.06)}
.btn:active{transform:translateY(0) scale(.97)}
.actions{margin-top:38px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.hint{
  margin-top:34px;font-family:var(--font-m);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--fade);
}
footer{
  border-top:1px solid var(--line);padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  text-align:center;font-family:var(--font-m);font-size:11px;color:var(--fade);letter-spacing:.5px;
}
footer a{color:var(--mist);transition:color .25s}
footer a:hover{color:var(--spectral)}
@media (max-width:600px){
  .actions .btn{width:100%;max-width:340px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<main>
  <div class="inner">
    <svg class="hero-mark" viewBox="0 0 200 261" fill="none" role="img" aria-label="GhostLink logo"><g fill="none" stroke="currentColor" stroke-linecap="round"><path d="M41.3 46.9A70 70 0 0 1 158.7 46.9" stroke-width="20"/><path d="M64.9 67.9A39 39 0 0 1 135.1 67.9" stroke-width="18"/></g><path fill="currentColor" fill-rule="evenodd" d="M20 159A80 80 0 0 1 180 159V243Q160 269 140 243Q120 269 100 243Q80 269 60 243Q40 269 20 243ZM58 156a16 16 0 1 0 32 0a16 16 0 1 0-32 0ZM110 156a16 16 0 1 0 32 0a16 16 0 1 0-32 0Z"/></svg>
    <div class="code">404</div>
    <h1>This page left no trace.</h1>
    <p class="sub">Whatever was here is gone — or never existed. We couldn't say either way; we don't keep records.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Back to GhostLink
      </a>
      <a href="/setup.html" class="btn btn-ghost">Setup guide</a>
    </div>
    <div class="hint">No logs. No referrer. No memory of this visit.</div>
  </div>
</main>

<footer>
  © 2026 GhostLink · GPL-3.0 · <a href="/#privacy">Privacy</a> · <a href="/#terms">Terms</a>
</footer>

</body>
</html>
