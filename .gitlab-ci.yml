# GitLab CI for the GitLab mirror (gitlab.com/shadow_dancers/Ghostlink).
#
# Mirrors .github/workflows/ci.yml — same commands, same gates — and adds a
# GitLab Pages deploy of the web app. GitHub stays the primary: releases and
# desktop installers are built by .github/workflows/release.yml only.

workflow:
  rules:
    # Merge requests get one pipeline; branch pushes don't duplicate it.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - package
  - deploy

default:
  interruptible: true

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  npm_config_audit: "false"
  npm_config_fund: "false"

.npm-cache:
  cache:
    key:
      files: [package-lock.json, gmp-core/package-lock.json]
    paths: [.npm/]
    policy: pull-push

# ── Tests ─────────────────────────────────────────────────────────────────
# engines.node is ">=22.12.0"; test the floor and the current LTS.
test:
  stage: test
  extends: .npm-cache
  image: node:${NODE_VERSION}
  parallel:
    matrix:
      - NODE_VERSION: ["22", "24"]
  variables:
    # The test job never launches Electron; skip the ~100 MB binary download.
    ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  timeout: 30m
  script:
    - npm ci
    # gmp-core is not a workspace — it has its own lockfile.
    - npm run install:gmp
    - npm run build:gmp
    - npm run build
    # Bundle-sync gate: the committed app.bundle.js is what Pages serves, so it
    # must match the source exactly.
    - |
      if ! git diff --exit-code --stat app.bundle.js; then
        echo "Committed app.bundle.js does not match the source. Run 'npm run build' and commit the result — never hand-edit the bundle."
        exit 1
      fi
    - npm run test:web
    - npm run test:gmp
    - npm run test:mobile

# Advisory until the remaining React Native / React Navigation advisories are
# fixed (see docs/PRODUCTION_READINESS.md): findings are printed as warnings
# and the job stays green, like the GitHub audit job. To enforce, drop the
# `|| echo` fallbacks.
audit:
  stage: test
  image: node:22
  timeout: 10m
  script:
    - npm audit --omit=dev --audit-level=high || echo "WARNING - npm audit found high/critical advisories (advisory, see docs/PRODUCTION_READINESS.md)"
    - npm audit --prefix gmp-core --omit=dev --audit-level=high || echo "WARNING - npm audit found high/critical advisories in gmp-core"

# ── Desktop packaging sanity ──────────────────────────────────────────────
desktop-package:
  stage: package
  extends: .npm-cache
  image: node:22
  needs: []
  timeout: 30m
  variables:
    # The interop step builds a pinned older commit (git archive).
    GIT_DEPTH: "0"
  script:
    - npm ci
    - npm run install:gmp
    - npm run build:gmp
    - npm run build
    # Electron's binary links GTK, NSS, X11, ALSA, CUPS, GBM...; node:22 (Debian,
    # no desktop) ships none of them, so the binary could not start and the
    # runtime test failed as "Electron undefined". GitHub's ubuntu runner has
    # them. ELECTRON_RUN_AS_NODE needs no display, only the libraries.
    - apt-get update -qq
    - |
      apt-get install -y -qq --no-install-recommends \
        libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 libcups2 \
        libdbus-1-3 libdrm2 libgtk-3-0 libgbm1 libxcomposite1 libxdamage1 libxfixes3 \
        libxrandr2 libxkbcommon0 libxcb1 libx11-6 libxext6 libpango-1.0-0 libcairo2 \
        libexpat1 libudev1 libglib2.0-0 \
        "$(apt-cache show libasound2t64 >/dev/null 2>&1 && echo libasound2t64 || echo libasound2)"
    # Fail here, by name, if any library is still missing (the binary is
    # fetched on first require by Electron 44's index.js).
    - |
      E="$(node -p "require('electron')" | tail -n 1)"
      if ldd "$E" | grep 'not found'; then echo "Electron cannot start: the libraries above are missing from this image"; exit 1; fi
      echo "Electron's shared libraries are all present ($E)"
    # gmp-core under Electron's bundled Node (the test job has no Electron binary).
    - (cd gmp-core && node test/electron-runtime-test.js)
    # Wire interop with a PINNED older build (INTEROP_OLD_REF in the test).
    - (cd gmp-core && node test/interop-old-new.mjs)
    # build:dir = electron-builder --dir, preceded by prepare-packaging.cjs.
    - (cd electron && npm run build:dir)
    - |
      res=electron/dist/linux-unpacked/resources
      for f in app.asar webapp/index.html webapp/app.bundle.js webapp/vendor webapp/assets \
               gmp-core/dist/gmp-node-manager.js gmp-core/dist/gmp-bridge.js \
               gmp-core/node_modules/ws gmp-core/node_modules/@noble/curves gmp-core/node_modules/@noble/hashes; do
        if [ ! -e "$res/$f" ]; then
          echo "packaged app is missing resources/$f"
          exit 1
        fi
      done
      # The packaged mesh core must load from its own bundled node_modules,
      # not from the checkout's — copy it out of the tree before importing.
      tmp=$(mktemp -d)
      cp -r "$res/gmp-core" "$tmp/"
      (cd "$tmp/gmp-core" && node --input-type=module -e \
        "await import('./dist/gmp-node-manager.js'); await import('./dist/gmp-bridge.js'); console.log('packaged gmp-core imports OK')")

# ── GitLab Pages: the web app ─────────────────────────────────────────────
# Publishes only what index.html loads (the same set the desktop app ships),
# never the whole repository. Runs on the default branch after tests pass.
pages:
  stage: deploy
  image: alpine:3.20
  needs: [test]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - mkdir -p public
    - cp -r index.html app.bundle.js vendor src shared assets public/
    - cp LICENSE public/
    - ls -R public | head -50
  artifacts:
    paths: [public]
  environment:
    name: pages
    url: $CI_PAGES_URL
