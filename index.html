// bridgeReachable: null = still trying, false = no bridge process, true = bridge up.
// 'relayed-unseparated' is shown separately: the relay's operator already
// knows this identity and could link relayed conversations to the user.
const MESH_TRANSPORT_LABELS = {
  'direct': 'Ghost Mesh',
  'relayed': 'Ghost Mesh · Relayed',
  'relayed-unseparated': 'Ghost Mesh · Relayed, not separated',
};
const RELAYED_UNSEPARATED_EXPLANATION =
  'Relayed through a host that is not separated from the one that knows your identity. ' +
  'Its operator can link this conversation to you.';
// Offline delivery. Each state is set by a protocol event, never by
// a timer: 'stored' by the storage host's STORE_ACK, 'delivered' only by the
// recipient's receipt coming back in a tombstone.
const SF_STATE_LABELS = {
  storing: 'storing…',
  stored: 'sent (stored)',
  delivered: 'delivered',
  expired: 'no receipt',
};
const SF_STATE_TITLES = {
  storing: 'Peer offline: handing the sealed message to its mailbox.',
  stored: 'The mailbox host acknowledged it. It is waiting there, sealed, for the recipient.',
  delivered: 'The recipient opened it and its sealed receipt came back.',
  expired: 'No receipt came back within two weeks, and none can any more. The message may or may not have been read.',
};
const STORAGE_UNSEPARATED_LABEL = 'Ghost Mesh · Storage not separated';
const STORAGE_UNSEPARATED_EXPLANATION =
  'Your mailbox host is not known to be run by someone other than the hosts that know your identity. ' +
  'Its operator could link your mailbox to you. Self-host a storage peer to close this (gmp storage-peer).';
function meshModeLabel(transport) {
  return MESH_TRANSPORT_LABELS[transport] || MESH_TRANSPORT_LABELS.direct;
}

// meshStatus: null until the first bootstrap round reports back.
function getMeshTroubleKey(bridgeReachable, meshStatus) {
  if (bridgeReachable === false) return 'bridge-down';
  if (!meshStatus || meshStatus.bootstrapped !== false) return null;
  // Bootstrap reports failure whenever it lands under minPeers (3 by default),
  // which a single healthy public peer never reaches. One peer is enough to
  // resolve addresses and route, so there is nothing to warn about — warning
  // here is what made a working mesh read as a broken one.
  if (meshStatus.peersConnected > 0) return null;
  const reason = meshStatus.reason;
  if (reason && MESH_TROUBLE[reason]) return reason;
  // An older bridge sends no reason at all. Rather than assert a cause we do
  // not have, fall back to the peer list being empty when the bridge told us it
  // was, and to the neutral wording otherwise.
  if (meshStatus.publicPeersConfigured === 0) return 'no-public-peers-configured';
  return 'unknown';
}

const MeshTroubleNotice = ({ bridgeReachable, meshStatus, style }) => {
  const key = getMeshTroubleKey(bridgeReachable, meshStatus);
  if (!key) return null;
  const { title, body } = MESH_TROUBLE[key];
  const attempts = (meshStatus && meshStatus.attempts) || [];
  return html`<div style=${{ marginTop: 12, padding: "10px 12px", borderRadius: 8, background: PALETTE.amberGlow, border: `1px solid ${PALETTE.amberGlow}`, fontSize: 10, color: PALETTE.amber, textAlign: "left", lineHeight: 1.6, ...(style || {}) }}>
    <strong>${title}.</strong> ${body}
    ${attempts.length > 0 && html`<div style=${{ marginTop: 6, color: PALETTE.mist, fontFamily: "monospace", fontSize: 9 }}>
      ${attempts.slice(0, 3).map((a) => html`<div key=${`${a.address}:${a.port}`}>${a.address}:${a.port} — ${a.message}</div>`)}
    </div>`}
  </div>`;
};

// ==================== ERROR BOUNDARY ====================
class ErrorBoundary extends React.Component {
  constructor(props) {super(props);this.state = { hasError: false, error: null };}
  static getDerivedStateFromError(error) {return { hasError: true, error };}
  render() {
    if (this.state.hasError) {
      return React.createElement('div', {
        style: { display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100vh', background: PALETTE.obsidian, color: PALETTE.crimson, fontFamily: "'JetBrains Mono', monospace", padding: 20, textAlign: 'center' }
      },
      React.createElement('div', { style: { fontSize: 48, marginBottom: 16 } }, '\u26A0'),
      React.createElement('div', { style: { fontSize: 18, fontWeight: 700, marginBottom: 8 } }, 'GhostLink Error'),
      React.createElement('div', { style: { fontSize: 12, color: PALETTE.mist, maxWidth: 400 } }, this.state.error?.message || 'An unexpected error occurred'),
      React.createElement('button', {
        onClick: () => {this.setState({ hasError: false, error: null });},
        style: { marginTop: 20, padding: '10px 20px', background: PALETTE.crimson, color: PALETTE.frost, border: 'none', borderRadius: 8, cursor: 'pointer', fontFamily: "'JetBrains Mono', monospace" }
      }, 'Reload App')
      );
    }
    return this.props.children;
  }
}

// Helper components for React-based audio/video elements with robust lifecycle management
const VideoPlayer = ({ stream, style, muted }) => {
  const videoRef = useRef(null);
  useEffect(() => {
    if (videoRef.current && stream) {
      if (videoRef.current.srcObject !== stream) {
        videoRef.current.srcObject = stream;
      }
    }
  }, [stream]);
  return html`<video ref=${videoRef} autoPlay playsInline muted=${muted} style=${style} />`;
};

const AudioPlayer = ({ stream }) => {
  const audioRef = useRef(null);
  useEffect(() => {
    if (audioRef.current && stream) {
      if (audioRef.current.srcObject !== stream) {
        audioRef.current.srcObject = stream;
      }
    }
  }, [stream]);
  return html`<audio ref=${audioRef} autoPlay />`;
};

// ==================== BRIDGE URL HELPER ====================
// ?bridge=IP:PORT lets LAN devices pick the bridge host (default
// localhost:3002), using wss:// when the page is served over HTTPS.
// ?gmpPort= sets the GMP listen port (default 49500); the bridge 'start'
// message, the invite code and the joiner's dial all read it from here.
function getGmpPort() {
  const p = parseInt(new URLSearchParams(window.location.search).get('gmpPort'), 10);
  return Number.isInteger(p) && p > 0 && p < 65536 ? p : 49500;
}

// A ?bridge= link controls where the app connects, so the recovery phrase is
// only ever sent to a bridge on this machine. Remote bridges use
// GMP_SEED_PHRASE locally.
function isTrustedBridgeTarget() {
  try {
    const host = new URL(getBridgeWsUrl()).hostname.toLowerCase().replace(/^\[|\]$/g, '');
    return host === 'localhost' || host === '127.0.0.1' || host === '::1';
  } catch (e) {
    return false;
  }
}

function getBridgeWsUrl() {
  const isSecurePage = window.location.protocol === 'https:';
  const scheme = isSecurePage ? 'wss' : 'ws';
  const params = new URLSearchParams(window.location.search);
  const bridge = params.get('bridge'); // e.g. 192.168.1.15:3002
  if (bridge) {
    // If user only passed an IP (no port), append default port
    const target = bridge.includes(':') ? bridge : bridge + ':3002';
    return `${scheme}://${target}`;
  }
  const bridgePort = params.get('bridgePort') || '3002';
  return `${scheme}://localhost:${bridgePort}`;
}

// With ?bridge= over plain http://, only ws:// is possible and WebCrypto is
// unavailable on a LAN IP. Returns the HTTPS URL to reopen at, or null.
function getBridgeInsecureHttpsUrl() {
  try {
    const loc = window.location;
    const params = new URLSearchParams(loc.search);
    if (!params.get('bridge')) return null;
    if (loc.protocol === 'https:') return null;
    return `https://${loc.host}${loc.pathname}${loc.search}`;
  } catch (e) {return null;}
}

// ICE servers: public STUN plus user-configured TURN when enabled.
// TURN credentials are kept in memory only (saveTurnServers persists the URL),
// so the settings UI publishes the live list here.
let sessionTurnServers = [];

function setSessionTurnServers(list) {
  sessionTurnServers = Array.isArray(list) ? list : [];
}

function getIceServers() {
  const servers = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun2.l.google.com:19302' }];

  try {
    if (localStorage.getItem('gl_turn_fallback') === 'true') {
      // Prefer the session list; fall back to the URL-only persisted copy for
      // the window before the settings UI has published, and for unauthenticated
      // relays, which need no credential to begin with.
      let turn = sessionTurnServers.filter((s) => s && typeof s.url === 'string' && s.url.trim());
      if (!turn.length) {
        const parsed = JSON.parse(localStorage.getItem('gl_turn_servers') || '[]');
        turn = Array.isArray(parsed) ? parsed : [];
      }
      for (const s of turn) {
        if (s && typeof s.url === 'string' && s.url.trim()) {
          const entry = { urls: s.url.trim() };
          if (s.username) entry.username = s.username;
          if (s.credential) entry.credential = s.credential;
          servers.push(entry);
        }
      }
    }
  } catch (e) {/* malformed config — fall back to STUN-only */}
  return servers;
}

// Helper to discover the local LAN IP address of this device using WebRTC
async function getLocalIPAddress() {
  return new Promise((resolve) => {
    try {
      const pc = new RTCPeerConnection({ iceServers: [] });
      pc.createDataChannel('');
      pc.createOffer().then((offer) => pc.setLocalDescription(offer));

      let resolved = false;
      pc.onicecandidate = (ice) => {
        if (resolved) return;
        if (ice && ice.candidate && ice.candidate.candidate) {
          const parts = ice.candidate.candidate.split(' ');
          const ip = parts[4];
          if (ip && ip.match(/^(192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)/)) {
            resolved = true;
            pc.close();
            resolve(ip);
          }
        }
      };
      setTimeout(() => {
        if (!resolved) {
          pc.close();
          // fallback to location.hostname if WebRTC IP gathering fails or times out
          if (window.location.hostname && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            resolve(window.location.hostname);
          } else {
            resolve('127.0.0.1');
          }
        }
      }, 800);
    } catch (e) {
      resolve(window.location.hostname || '127.0.0.1');
    }
  });
}

// ==================== GHOST ADDRESS ====================
// GHOST-XXX-XXX-XXX — derived from the GMP NodeID (first 45 bits, Crockford
// base32). It carries no location; the mesh resolves it to a NodeID.
//
// SOURCE OF TRUTH: gmp-core/src/ghost-address.js. Inlined because Electron loads
// this page over file://, where module imports are blocked.
// gmp-core/test/ghost-address-parity-test.js checks the two agree.
const GHOST_ADDRESS_ALPHABET = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const GHOST_ADDRESS_LENGTH = 9;
const GHOST_ADDRESS_PATTERN = /^GHOST-[0-9A-HJKMNP-TV-Z]{3}-[0-9A-HJKMNP-TV-Z]{3}-[0-9A-HJKMNP-TV-Z]{3}$/;
const NODE_ID_PATTERN = /^[0-9a-f]{64}(?:[0-9a-f]{64})?$/i;

function ghostAddressFromNodeId(nodeIdHex) {
  const hex = typeof nodeIdHex === 'string' ? nodeIdHex.trim().toLowerCase() : '';
  if (!/^[0-9a-f]{12,}$/.test(hex)) {
    throw new Error('ghostAddressFromNodeId: expected a hex NodeID of at least 48 bits');
  }
  let value = BigInt('0x' + hex.slice(0, 12)) >> 3n;
  let chars = '';
  for (let i = 0; i < GHOST_ADDRESS_LENGTH; i++) {
    chars = GHOST_ADDRESS_ALPHABET[Number(value & 31n)] + chars;
    value >>= 5n;
  }
  return `GHOST-${chars.slice(0, 3)}-${chars.slice(3, 6)}-${chars.slice(6, 9)}`;
}

function normalizeGhostAddress(input) {
  if (typeof input !== 'string') return null;
  let body = input.trim().toUpperCase().replace(/^GHOST[\s\-_:]*/, '');
  body = body.replace(/[^0-9A-Z]/g, '');
  body = body.replace(/O/g, '0').replace(/[IL]/g, '1').replace(/U/g, 'V');
  if (body.length !== GHOST_ADDRESS_LENGTH) return null;
  for (const ch of body) {
    if (!GHOST_ADDRESS_ALPHABET.includes(ch)) return null;
  }
  return `GHOST-${body.slice(0, 3)}-${body.slice(3, 6)}-${body.slice(6, 9)}`;
}

function isGhostAddress(input) {
  return normalizeGhostAddress(input) !== null;
}

function isNodeIdHex(input) {
  return typeof input === 'string' && NODE_ID_PATTERN.test(input.trim());
}

// Peers connected at least once, by NodeID. Persisted so
// GMPBridgeConnector._restoreSessions can silently re-establish them.
const KNOWN_PEERS_KEY = 'gl_gmp_known_peers';
// Peers that must NOT be auto-restored, even though the chat cache still knows
// them — a deliberate removal has to survive a reload, or the session restore
// would quietly undo it. Kept separate from the cache so removing a peer does
// not also destroy their name and public key.
const BLOCKED_PEERS_KEY = 'gl_gmp_blocked_peers';
const KNOWN_PEERS_MAX = 100;

function loadBlockedPeers() {
  try {
    const raw = JSON.parse(localStorage.getItem(BLOCKED_PEERS_KEY) || '[]');
    return new Set(Array.isArray(raw) ? raw.filter(isNodeIdHex) : []);
  } catch (e) {
    return new Set();
  }
}

function setPeerBlocked(nodeId, blocked) {
  if (!isNodeIdHex(nodeId)) return;
  try {
    const set = loadBlockedPeers();
    if (blocked) set.add(nodeId); else set.delete(nodeId);
    localStorage.setItem(BLOCKED_PEERS_KEY, JSON.stringify(Array.from(set)));
  } catch (e) { console.warn('[Peers] Failed to update blocked peers:', e.message); }
}

function loadKnownPeers() {
  const peers = [];
  const seen = new Set();
  const blocked = loadBlockedPeers();

  const add = (nodeId, name, lastConnectedAt) => {
    if (!isNodeIdHex(nodeId) || seen.has(nodeId) || blocked.has(nodeId)) return;
    seen.add(nodeId);
    peers.push({ nodeId, name: name || null, lastConnectedAt: lastConnectedAt || 0 });
  };

  try {
    const raw = JSON.parse(localStorage.getItem(KNOWN_PEERS_KEY) || '[]');
    if (Array.isArray(raw)) for (const p of raw) if (p) add(p.nodeId, p.name, p.lastConnectedAt);
  } catch (e) {/* fall through to the chat cache */}

  // Also restore contacts from the chat peer cache (keyed by peer id, which
  // for mesh peers is the NodeID).
  try {
    const cached = PeerCache.getAllPeers();
    for (const [peerId, info] of Object.entries(cached || {})) {
      add(peerId, info && info.name, info && info.lastSeen);
    }
  } catch (e) { console.warn('[Peers] Failed to load peer cache:', e.message); }

  return peers.slice(0, KNOWN_PEERS_MAX);
}

function rememberKnownPeer(nodeId, info = {}) {
  if (!isNodeIdHex(nodeId)) return;
  try {
    const peers = loadKnownPeers().filter((p) => p.nodeId !== nodeId);
    peers.unshift({ nodeId, name: info.name || null, lastConnectedAt: Date.now() });
    localStorage.setItem(KNOWN_PEERS_KEY, JSON.stringify(peers.slice(0, KNOWN_PEERS_MAX)));
  } catch (e) {/* storage full or blocked — reconnect still works this session */}
}

function forgetKnownPeer(nodeId) {
  setPeerBlocked(nodeId, true);
  try {
    const raw = JSON.parse(localStorage.getItem(KNOWN_PEERS_KEY) || '[]');
    const kept = (Array.isArray(raw) ? raw : []).filter((p) => p && p.nodeId !== nodeId);
    localStorage.setItem(KNOWN_PEERS_KEY, JSON.stringify(kept));
  } catch (e) { console.warn('[Peers] Failed to forget peer:', e.message); }
}

// ==================== GMP BRIDGE CONNECTOR ====================
class GMPBridgeConnector {
  constructor(identity) {
    this._listeners = {};
    this.identity = identity;
    this.ws = null;
    this.wsOpen = false;
    this.knownPeers = {};
    this.meshConns = {}; // mock for index.html compatibility
    this.states = {};
    this.pcs = {};
    this.dcs = {};
    // Peers already announced as connected. Three data channels open per peer,
    // so the raw onopen/onclose events fire several times; listeners (plan-limit
    // checks, key announces, queue flushes) must see exactly one of each.
    this._announced = new Set();
    // Peers force-removed via removePeer(). Traffic to and from these is
    // dropped until an explicit reconnect clears the set. Seeded from storage:
    // removePeer() persists the block, so starting empty meant a reload silently
    // re-admitted every peer the user had removed.
    this._blocked = loadBlockedPeers();

    // Our own mesh identity, filled in by the bridge's 'started' message.
    this.nodeId = null;
    this.ghostAddress = null;
    this._readyWaiters = [];

    // Whether the node found anyone to bootstrap against. Null until the first
    // bootstrap round finishes. False does not mean broken — LAN peers are
    // still reachable — but it does mean nobody on the open internet can be
    // resolved, which is worth saying out loud rather than spinning forever.
    this.meshBootstrapped = null;

    // Null until the first socket attempt settles. Distinct from
    // meshBootstrapped: "no bridge" and "no peers" need different fixes.
    this.bridgeReachable = null;

    // Set from the bridge's external-address broadcast once a public peer has
    // answered a BINDING_REQUEST. Null until then.
    this.externalAddress = null;

    // In-flight resolve/connectNode requests, keyed by requestId.
    this._pending = new Map();
    this._requestSeq = 0;

    // Reconnect state. The bridge socket dropping is a local event (node
    // restarted, machine slept) and must never surface to the user as "your
    // connection is gone, set it up again" — we just dial it back and restore
    // every peer session that was live.
    this._shouldReconnect = true;
    this._reconnectAttempt = 0;
    this._reconnectTimer = null;
    this._destroyed = false;
    // Per-peer redial backoff timers, so a peer that goes offline is picked up
    // again the moment it returns without hammering the mesh in between.
    this._redialTimers = new Map();
    this._redialAttempts = new Map();
  }

  /** Resolves once the bridge has reported our NodeID. */
  waitUntilReady(timeoutMs = 15000) {
    if (this.nodeId) return Promise.resolve({ nodeId: this.nodeId, ghostAddress: this.ghostAddress });
    return new Promise((resolve, reject) => {
      const waiter = { resolve, reject, timer: null };
      waiter.timer = setTimeout(() => {
        this._readyWaiters = this._readyWaiters.filter((w) => w !== waiter);
        reject(new Error('Ghost Mesh did not come up in time'));
      }, timeoutMs);
      this._readyWaiters.push(waiter);
    });
  }

  _resolveReady() {
    const waiters = this._readyWaiters;
    this._readyWaiters = [];
    for (const waiter of waiters) {
      clearTimeout(waiter.timer);
      waiter.resolve({ nodeId: this.nodeId, ghostAddress: this.ghostAddress });
    }
  }

  /** Send a request that expects a matching reply, and await it. */
  _request(payload, replyType, timeoutMs = 12000) {
    return new Promise((resolve, reject) => {
      if (!this.wsOpen || !this.ws) {
        reject(new Error('Ghost Mesh bridge is not connected'));
        return;
      }
      const requestId = `req-${++this._requestSeq}-${Date.now()}`;
      const timer = setTimeout(() => {
        this._pending.delete(requestId);
        reject(new Error(`${replyType} timed out`));
      }, timeoutMs);
      this._pending.set(requestId, { replyType, resolve, reject, timer });
      try {
        this.ws.send(JSON.stringify({ ...payload, requestId }));
      } catch (e) {
        clearTimeout(timer);
        this._pending.delete(requestId);
        reject(e);
      }
    });
  }

  _settleRequest(msg) {
    const entry = msg.requestId ? this._pending.get(msg.requestId) : null;
    if (!entry) return false;
    clearTimeout(entry.timer);
    this._pending.delete(msg.requestId);
    entry.resolve(msg);
    return true;
  }

  _rejectAllRequests(reason) {
    for (const [, entry] of this._pending) {
      clearTimeout(entry.timer);
      entry.reject(new Error(reason));
    }
    this._pending.clear();
  }

  /**
   * Turn a Ghost Address into a NodeID, retrying "not-found" for a while in
   * case the peer is still starting up.
   */
  async resolveAddress(address, { timeoutMs = 20000, onProgress = null } = {}) {
    const normalized = normalizeGhostAddress(address);
    if (!normalized) throw new Error('That is not a Ghost Address');

    const deadline = Date.now() + timeoutMs;
    let attempt = 0;
    let last = null;

    while (Date.now() < deadline) {
      attempt++;
      if (onProgress) onProgress({ attempt, address: normalized });
      last = await this._request({ type: 'resolve', address: normalized }, 'resolve-result');

      if (last.reason === 'ok' && last.nodeId) return last;
      if (last.reason === 'ambiguous') {
        throw new Error(`${normalized} matches more than one identity on the mesh — ask your peer for their full NodeID`);
      }
      if (last.reason === 'invalid-address') throw new Error('That is not a Ghost Address');

      await new Promise((r) => setTimeout(r, 1000));
    }

    throw new Error(
      last && last.reason === 'not-started'
        ? 'Ghost Mesh is still starting up — try again in a moment'
        : `${normalized} is not reachable on the mesh right now. Make sure your peer has GhostLink open.`
    );
  }

  /**
   * Open a session with a peer by NodeID. Dialling deliberately lifts a
   * previous force-removal; inbound connections never do.
   */
  async connectToNode(nodeId) {
    this.unblockPeer(nodeId);
    const result = await this._request({ type: 'connectNode', nodeId }, 'connect-result', 20000);
    if (!result.connected) {
      throw new Error(result.error || result.message || 'Could not reach that peer through the mesh');
    }
    rememberKnownPeer(result.nodeId || nodeId);
    return result;
  }

  /** Quietly re-establish every known peer session after the bridge returns. */
  _restoreSessions() {
    for (const peer of loadKnownPeers()) {
      if (this._blocked.has(peer.nodeId)) continue;
      if (this.isConnected(peer.nodeId)) continue;
      this._scheduleRedial(peer.nodeId, 0);
    }
  }

  /** Retry a peer indefinitely with backoff capped at 30s. */
  _scheduleRedial(nodeId, attempt = null) {
    if (this._destroyed || this._blocked.has(nodeId)) return;
    if (this._redialTimers.has(nodeId)) return;

    const n = attempt === null ? (this._redialAttempts.get(nodeId) || 0) : attempt;
    this._redialAttempts.set(nodeId, n + 1);
    const delay = Math.min(1000 * Math.pow(2, Math.min(n, 5)), 30000);

    const timer = setTimeout(async () => {
      this._redialTimers.delete(nodeId);
      if (this._destroyed || this._blocked.has(nodeId)) return;
      if (this.isConnected(nodeId)) {
        this._redialAttempts.delete(nodeId);
        return;
      }
      if (!this.wsOpen) return; // the socket's own reconnect will retrigger us

      try {
        await this.connectToNode(nodeId);
        this._redialAttempts.delete(nodeId);
      } catch (e) {
        this._scheduleRedial(nodeId);
      }
    }, delay);

    if (timer.unref) timer.unref();
    this._redialTimers.set(nodeId, timer);
  }

  _cancelRedial(nodeId) {
    const timer = this._redialTimers.get(nodeId);
    if (timer) clearTimeout(timer);
    this._redialTimers.delete(nodeId);
    this._redialAttempts.delete(nodeId);
  }

  /**
   * True while at least one transport to this peer can still carry a message:
   * a bridge-routed mesh entry, or any open direct data channel.
   */
  _isPeerLive(peerId) {
    if (this.meshConns[peerId]) return true;
    const chans = this.dcs[peerId];
    return !!(chans && Object.values(chans).some((ch) => ch && ch.readyState === 'open'));
  }

  /** Emit peer-connected at most once per peer, until it disconnects. */
  _announceConnected(peerId, info) {
    if (this._blocked.has(peerId)) return false;
    this.states[peerId] = 'connected';
    if (this._announced.has(peerId)) return false;
    this._announced.add(peerId);
    this.emit('peer-connected', peerId, info);
    return true;
  }

  /**
   * Emit peer-disconnected once, and only once the peer is actually
   * unreachable. Pass force for a deliberate teardown.
   */
  _announceDisconnected(peerId, force = false) {
    if (!force && this._isPeerLive(peerId)) return false;
    if (!this._announced.delete(peerId)) return false;
    this.emit('peer-disconnected', peerId);
    return true;
  }

  _setupDc(peerId, label, ch) {
    if (!this.dcs[peerId]) this.dcs[peerId] = { messages: null, files: null, presence: null };
    this.dcs[peerId][label] = ch;
    ch.onopen = () => {
      this._announceConnected(peerId, { mode: 'P2P Direct' });
    };
    ch.onclose = () => {
      // Another channel (or the bridge route) may still be usable.
      if (this._isPeerLive(peerId)) return;
      this.states[peerId] = 'disconnected';
      this._announceDisconnected(peerId);
    };
    ch.onmessage = (evt) => {
      if (this._blocked.has(peerId)) return;
      if (label === 'messages') {
        try {
          const msg = JSON.parse(evt.data);
          this.emit('message', peerId, msg);
        } catch (e) {
          this.emit('message', peerId, evt.data);
        }
      } else if (label === 'files') {
        try {
          const parsed = JSON.parse(evt.data);
          this.emit('file-chunk', peerId, parsed);
        } catch (e) {
          this.emit('file-chunk', peerId, evt.data);
        }
      } else if (label === 'presence') {
        try {
          const parsed = JSON.parse(evt.data);
          if (parsed.type === 'typing') this.emit('message', peerId, parsed);
          else this.emit('presence-data', peerId, parsed);
        } catch (e) {
          this.emit('presence-data', peerId, evt.data);
        }
      }
    };
  }

  on(event, fn) {
    (this._listeners[event] = this._listeners[event] || []).push(fn);
    return this;
  }

  off(event, fn) {
    if (!this._listeners[event]) return this;
    this._listeners[event] = this._listeners[event].filter((f) => f !== fn);
    return this;
  }

  emit(event, ...args) {
    if (!this._listeners[event]) return;
    this._listeners[event].forEach((fn) => {try {fn(...args);} catch (e) {console.error(e);}});
  }

  async connect() {
    return new Promise((resolve, reject) => {
      try {
        const gmpPort = getGmpPort();

        this._shouldReconnect = true;
        this._destroyed = false;
        // NOTE: force-removal blocks deliberately survive a reconnect. connect()
        // is now also the automatic recovery path, and a peer the user removed
        // must stay removed across a bridge restart — otherwise _restoreSessions
        // would quietly dial them back in. removePeer/unblockPeer own that set.

        this.ws = new WebSocket(getBridgeWsUrl());
        this.ws.onopen = () => {
          this.wsOpen = true;
          this.bridgeReachable = true;
          if (window.setBridgeReachable) window.setBridgeReachable(true);
          const start = { type: 'start', port: gmpPort };
          // The recovery phrase goes only to a bridge on this machine. See
          // isTrustedBridgeTarget(): ?bridge= is attacker-controllable.
          if (isTrustedBridgeTarget()) {
            if (window.seedPhrase) start.seedPhrase = window.seedPhrase.join(" ");
          } else {
            console.warn('[GMP Bridge] Remote bridge target — withholding recovery phrase. ' +
            'Configure the seed on the bridge host via GMP_SEED_PHRASE.');
          }
          this.ws.send(JSON.stringify(start));
          resolve();
        };

        this.ws.onmessage = (evt) => {
          let msg;
          try {
            msg = JSON.parse(evt.data);
          } catch (e) {
            return;
          }

          if (msg.type === 'resolve-result' || msg.type === 'connect-result') {
            this._settleRequest(msg);
            return;
          }

          if (msg.type === 'started') {
            this.nodeId = msg.nodeId || null;
            // Prefer the bridge's own derivation, but never leave the address
            // blank just because an older bridge did not send one.
            this.ghostAddress = msg.ghostAddress ||
              (this.nodeId ? (() => {try {return ghostAddressFromNodeId(this.nodeId);} catch (e) {return null;}})() : null);
            this._resolveReady();
            this.emit('signaling-connected');
            this.emit('mesh-identity', { nodeId: this.nodeId, ghostAddress: this.ghostAddress });
            if (window.setConnectionMode) window.setConnectionMode('Ghost Mesh Active');
            if (window.setSignalingConnected) window.setSignalingConnected(true);
            if (window.setSignalingAvailable) window.setSignalingAvailable(true);
            // Bring back whatever we were talking to before the socket dropped.
            this._restoreSessions();
            // Store-and-forward: whose channels to poll, then poll now.
            this.setMailboxContacts(loadKnownPeers().map((p) => p.nodeId));
            this.pollMailbox('foreground');
            this._installMailboxTriggers();
          } else if (msg.type === 'peer-connected') {
            if (this._blocked.has(msg.nodeId)) return;
            this._cancelRedial(msg.nodeId);
            rememberKnownPeer(msg.nodeId);
            this.setMailboxContacts(loadKnownPeers().map((p) => p.nodeId));
            this.meshConns[msg.nodeId] = { connId: msg.nodeId }; // mock
            this._announceConnected(msg.nodeId, { mode: meshModeLabel(msg.transport) });
          } else if (msg.type === 'bootstrap-complete' || msg.type === 'bootstrap-failed') {
            this.meshBootstrapped = msg.type === 'bootstrap-complete';
            // reason/attempts come from BootstrapManager.diagnose() and select
            // the matching troubleshooting message.
            this.emit('mesh-status', {
              bootstrapped: this.meshBootstrapped,
              peersConnected: msg.peersConnected || 0,
              reason: msg.reason || null,
              publicPeersConfigured: msg.publicPeersConfigured ?? null,
              peersFile: msg.peersFile || null,
              attempts: Array.isArray(msg.attempts) ? msg.attempts : []
            });
          } else if (msg.type === 'sf-stored' || msg.type === 'sf-delivered' || msg.type === 'sf-expired' || msg.type === 'sf-failed') {
            // Store-and-forward state for one message. Each comes from
            // the protocol — the storage host's ACK, the recipient's receipt,
            // the TTL passing, a refusal — never from a timer on this side.
            const state = { 'sf-stored': 'stored', 'sf-delivered': 'delivered', 'sf-expired': 'expired', 'sf-failed': 'failed' }[msg.type];
            if (msg.localId) this.emit('sf-state', { localId: msg.localId, state, reason: msg.message || null, code: msg.code || null });
          } else if (msg.type === 'storage-status') {
            this.emit('storage-status', { host: msg.host || null, separation: msg.separation || 'none', selfHosted: !!msg.selfHosted, pending: msg.pending || 0 });
          } else if (msg.type === 'external-address') {
            // What a public peer says this node looks like from outside, learned
            // over BINDING_REQUEST. Worth keeping even when it matches the local
            // address: it is the difference between "we assume" and "a peer told us".
            this.externalAddress = { address: msg.address, port: msg.port };
            this.emit('external-address', this.externalAddress);
          } else if (msg.type === 'peer-disconnected') {
            this.states[msg.nodeId] = 'disconnected';
            delete this.meshConns[msg.nodeId];
            this._announceDisconnected(msg.nodeId);
            // Not a user problem to solve: start bringing it back immediately.
            if (!this._blocked.has(msg.nodeId)) this._scheduleRedial(msg.nodeId, 0);
          } else if (msg.type === 'message') {
            // A force-removed peer must not be able to keep delivering through
            // the bridge just because the bridge still has a route to it.
            if (this._blocked.has(msg.fromNodeId)) return;
            try {
              const parsed = JSON.parse(msg.payload);
              if (parsed.type === 'file-meta' || parsed.type === 'file-chunk' || parsed.type === 'file-done' || parsed.type === 'file-ack') {
                this.emit('file-chunk', msg.fromNodeId, parsed);
              } else {
                this.emit('message', msg.fromNodeId, parsed);
              }
            } catch (e) {
              this.emit('message', msg.fromNodeId, msg.payload);
            }
          }
        };

        this.ws.onclose = () => {
          const hadSession = this.wsOpen;
          this.wsOpen = false;
          if (!hadSession) {
            this.bridgeReachable = false;
            if (window.setBridgeReachable) window.setBridgeReachable(false);
          }
          this._rejectAllRequests('Ghost Mesh bridge disconnected');
          // Retire bridge-only peers with the socket before announcing the loss,
          // so they do not stay "online". Direct data channels are unaffected.
          Object.keys(this.meshConns).forEach((peerId) => {
            delete this.meshConns[peerId];
            if (this._isPeerLive(peerId)) return;
            this.states[peerId] = 'disconnected';
            this._announceDisconnected(peerId);
          });
          this.emit('signaling-disconnected');
          if (window.setConnectionMode) window.setConnectionMode('Reconnecting');
          if (window.setSignalingConnected) window.setSignalingConnected(false);
          this._scheduleReconnect();
        };

        this.ws.onerror = (err) => {
          // A WebSocket that errors without ever opening is the signature of
          // nothing listening on the bridge port. Distinguished from a drop
          // after a successful session, which is a reconnect, not a missing
          // bridge.
          if (!this.wsOpen) {
            this.bridgeReachable = false;
            if (window.setBridgeReachable) window.setBridgeReachable(false);
          }
          const bridgeUrl = getBridgeWsUrl();
          if (bridgeUrl.startsWith('wss://')) {
            const httpsUrl = bridgeUrl.replace('wss://', 'https://');
            console.warn(
              `[GMP Bridge] WSS connection failed. If using a self-signed certificate, ` +
              `open ${httpsUrl} in a new tab first and accept the certificate, then reload this page.`
            );
          }
          this.emit('signaling-error', err);
          reject(err);
        };
      } catch (e) {
        reject(e);
      }
    });
  }

  /**
   * Reconnect the bridge socket indefinitely, backoff capped at 15s. Sessions
   * are restored by _restoreSessions on 'started'.
   */
  _scheduleReconnect() {
    if (this._destroyed || !this._shouldReconnect) return;
    if (this._reconnectTimer) return;

    const delay = Math.min(1000 * Math.pow(2, Math.min(this._reconnectAttempt, 4)), 15000);
    this._reconnectAttempt++;

    this._reconnectTimer = setTimeout(() => {
      this._reconnectTimer = null;
      if (this._destroyed || !this._shouldReconnect || this.wsOpen) return;
      this.connect()
        .then(() => {this._reconnectAttempt = 0;})
        .catch(() => this._scheduleReconnect());
    }, delay);

    if (this._reconnectTimer.unref) this._reconnectTimer.unref();
  }

  sendMessage(peerId, dataObj) {
    if (this._blocked.has(peerId)) return false;
    const dc = this.dcs[peerId]?.messages;
    if (dc && dc.readyState === 'open') {
      dc.send(typeof dataObj === 'string' ? dataObj : JSON.stringify(dataObj));
      return true;
    }
    if (!this.wsOpen) return false;
    const payload = typeof dataObj === 'string' ? dataObj : JSON.stringify(dataObj);
    this.ws.send(JSON.stringify({
      type: 'send',
      destinationNodeId: peerId,
      payload
    }));
    return true;
  }

  /**
   * Deposit a sealed message for an offline peer on its mailbox.
   * The answer arrives as an 'sf-state' event for localId: 'stored' once
   * the storage host acknowledged it, 'delivered' only when the recipient's
   * receipt comes back, 'failed' / 'expired' otherwise.
   */
  sendStored(peerId, localId, dataObj) {
    if (this._blocked.has(peerId) || !this.wsOpen) return false;
    this.ws.send(JSON.stringify({
      type: 'sf-send',
      localId,
      destinationNodeId: peerId,
      payload: typeof dataObj === 'string' ? dataObj : JSON.stringify(dataObj)
    }));
    return true;
  }

  pollMailbox(reason) {
    if (this.wsOpen) this.ws.send(JSON.stringify({ type: 'sf-poll', reason }));
  }

  setMailboxContacts(nodeIds) {
    if (this.wsOpen) this.ws.send(JSON.stringify({ type: 'sf-contacts', nodeIds }));
  }

  // Poll on app foreground and on network change; the node polls on
  // its own jittered interval besides. Installed once per connector.
  _installMailboxTriggers() {
    if (this._mailboxTriggers || typeof document === 'undefined') return;
    const onVisible = () => { if (document.visibilityState === 'visible') this.pollMailbox('foreground'); };
    const onOnline = () => this.pollMailbox('network');
    document.addEventListener('visibilitychange', onVisible);
    window.addEventListener('online', onOnline);
    this._mailboxTriggers = () => {
      document.removeEventListener('visibilitychange', onVisible);
      window.removeEventListener('online', onOnline);
    };
  }

  sendOnChannel(peerId, channelName, dataObj) {
    if (this._blocked.has(peerId)) return false;
    const dc = this.dcs[peerId]?.[channelName];
    if (dc && dc.readyState === 'open') {
      dc.send(typeof dataObj === 'string' ? dataObj : JSON.stringify(dataObj));
      return true;
    }
    if (!this.wsOpen) return false;
    const payload = typeof dataObj === 'string' ? dataObj : JSON.stringify(dataObj);
    if (channelName === 'presence') {
      this.ws.send(JSON.stringify({
        type: 'sendDirect',
        destinationNodeId: peerId,
        payload
      }));
    } else {
      this.ws.send(JSON.stringify({
        type: 'send',
        destinationNodeId: peerId,
        payload
      }));
    }
    return true;
  }

  sendPresence(peerId, dataObj) {
    return this.sendOnChannel(peerId, 'presence', dataObj);
  }

  isConnected(peerId) {
    return this.states[peerId] === 'connected' || this.dcs[peerId]?.messages?.readyState === 'open';
  }

  // Force-drop a single peer: closes its data channels / peer connection and
  // forgets the bridge mesh connection so nothing further is sent or accepted.
  // (The GMP bridge protocol has no per-peer disconnect command, so this is
  // enforced on the client side only.)
  removePeer(peerId) {
    // Block first: the bridge keeps its own route to this node, so inbound
    // messages and outbound sends must be refused until an explicit reconnect.
    this._blocked.add(peerId);
    // Stop the automatic session restore from resurrecting this peer, both now
    // (pending redial timer) and after a reload (persisted peer list).
    this._cancelRedial(peerId);
    forgetKnownPeer(peerId);

    const chans = this.dcs[peerId];
    if (chans) {
      Object.values(chans).forEach((ch) => {try {ch?.close?.();} catch (e) {}});
      delete this.dcs[peerId];
    }
    const pc = this.pcs[peerId];
    if (pc) {
      try {pc.close();} catch (e) {}
      delete this.pcs[peerId];
    }
    delete this.meshConns[peerId];
    delete this.knownPeers[peerId];
    this.states[peerId] = 'disconnected';
    // Forced: every transport is being closed on purpose.
    this._announceDisconnected(peerId, true);
    return true;
  }

  /**
   * Lift the block set by removePeer(). Local, deliberate action only — never
   * from a remote event.
   */
  unblockPeer(peerId) {
    setPeerBlocked(peerId, false);
    this._redialAttempts.delete(peerId);
    return this._blocked.delete(peerId);
  }

  /** End the bridge session deliberately; auto-reconnect is switched off. */
  disconnect() {
    this._shouldReconnect = false;
    if (this._reconnectTimer) {
      clearTimeout(this._reconnectTimer);
      this._reconnectTimer = null;
    }
    this._rejectAllRequests('Ghost Mesh bridge disconnected');
    if (this.ws) {
      this.ws.close();
      this.ws = null;
    }
    this.wsOpen = false;
    // Peers must be re-announced after a reconnect.
    this._announced.clear();
  }

  /** Full teardown: connections, data channels and listeners. */
  destroy() {
    this._destroyed = true;
    this._shouldReconnect = false;
    for (const timer of this._redialTimers.values()) clearTimeout(timer);
    this._redialTimers.clear();
    this._redialAttempts.clear();
    for (const waiter of this._readyWaiters) {
      clearTimeout(waiter.timer);
      waiter.reject(new Error('Connector destroyed'));
    }
    this._readyWaiters = [];
    Object.values(this.dcs).forEach((chans) => {
      if (chans) Object.values(chans).forEach((ch) => {try {ch?.close?.();} catch (e) {}});
    });
    Object.values(this.pcs).forEach((pc) => {try {pc.close();} catch (e) {}});
    this.dcs = {};
    this.pcs = {};
    this.meshConns = {};
    this.states = {};
    this.knownPeers = {};
    this._announced.clear();
    this._blocked.clear();
    this.disconnect();
    this._listeners = {};
  }

  /**
   * Connect to whatever a code identifies:
   *
   *   GHOST-XXX-XXX-XXX  a Ghost Address, resolved through the mesh.
   *   <128 hex chars>    a full NodeID, for the rare address collision.
   *   GHOST-a-b-c-d-port a legacy LAN code (accepted, never generated).
   *
   * Returns the connected peer's NodeID.
   */
  async joinRoom(code) {
    const raw = typeof code === 'string' ? code.trim() : '';
    if (!raw) throw new Error('No connection code given');

    if (isNodeIdHex(raw)) {
      const result = await this.connectToNode(raw.toLowerCase());
      return result.nodeId;
    }

    const address = normalizeGhostAddress(raw);
    if (address) {
      if (this.ghostAddress && address === this.ghostAddress) {
        throw new Error('That is your own Ghost Address');
      }
      const resolved = await this.resolveAddress(address);
      const result = await this.connectToNode(resolved.nodeId);
      return result.nodeId;
    }

    const legacy = this._parseLegacyLanCode(raw);
    if (legacy) {
      console.warn('[GMP Bridge Connector] Legacy LAN code — dialing', `${legacy.address}:${legacy.port}`);
      if (!this.wsOpen) throw new Error('Ghost Mesh bridge is not connected');
      this.ws.send(JSON.stringify({ type: 'connect', address: legacy.address, port: legacy.port }));
      return null;
    }

    throw new Error('Not a Ghost Address. Expected something like GHOST-7K2-M4Q-8ZB.');
  }

  /** GHOST-192-168-1-5-49500 → { address: '192.168.1.5', port: 49500 }, or null. */
  _parseLegacyLanCode(code) {
    const parts = code.replace(/^(GHOST-|GL-)/i, '').split('-');
    if (parts.length < 2) return null;
    const port = parseInt(parts[parts.length - 1], 10);
    const address = parts.slice(0, -1).join('.');
    if (!address || !Number.isInteger(port) || port <= 0 || port > 65535) return null;
    if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(address)) return null;
    // The address becomes a bridge dial target, so only private LAN ranges
    // are accepted.
    const octets = address.split('.').map(Number);
    if (octets.some((o) => !Number.isInteger(o) || o < 0 || o > 255)) return null;
    const [a, b] = octets;
    const isPrivateLan = a === 10 || (a === 172 && b >= 16 && b <= 31) || (a === 192 && b === 168);
    if (!isPrivateLan) return null;
    return { address, port };
  }

  async createManualOffer() {
    return { offerBase64: '' };
  }
  async processManualOffer(offerBase64) {
    return { answerBase64: '', peerInfo: {} };
  }
  async processManualAnswer(answerBase64) {
    return true;
  }
}

// ==================== MAIN APP ====================
function GhostLinkApp() {
  const WorkspacePanel = window.WorkspacePanel || (() => null);
  const WorkspaceRoster = window.WorkspaceRoster || (() => null);
  const UpgradeModal = window.UpgradeModal || (() => null);
  const WorkspaceCreateModal = window.WorkspaceCreateModal || (() => null);
  const WorkspaceJoinModal = window.WorkspaceJoinModal || (() => null);
  const WorkspaceInviteModal = window.WorkspaceInviteModal || (() => null);

  // Toast notification system
  const [toasts, setToasts] = useState([]);
  const addToast = (message, type = 'info') => {
    const id = Date.now() + '-' + Math.random();
    setToasts((prev) => [...prev.slice(-4), { id, message, type }]);
    setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 4000);
  };

  // Core state
  const [view, setView] = useState("splash");
  const [identity, setIdentity] = useState(null);
  const [displayName, setDisplayName] = useState("");
  const [activeTab, setActiveTab] = useState("chat");
  const [activeConvo, setActiveConvo] = useState(null);
  const [msgInput, setMsgInput] = useState("");
  const [chain] = useState(new Chain());
  // Chain.add() pushes into chain.blocks in place, so the array identity never
  // changes and an effect keyed on it alone would never re-run — recent blocks
  // would sit unpersisted until reload dropped them. Every mutation bumps this.
  const [chainRev, setChainRev] = useState(0);
  const bumpChain = useCallback(() => setChainRev((r) => r + 1), []);
  const [messages, setMessages] = useState({});
  const [sending, setSending] = useState(false);
  const [chainValid, setChainValid] = useState(true);

  // Expiry erases the body on both peers (sender when composing, receiver from

      selfDestructTimersRef.current.delete(blockHash);
    }
    const remap = await chain.destroyBlock(blockHash);
    bumpChain();
    setMessages((prev) => {
      const next = {};
      for (const [key, convo] of Object.entries(prev)) {
        next[key] = convo.map((m) => {
          if (m.hash === blockHash) {
            const { encrypted, ...rest } = m;
            return {
              ...rest, content: '', destroyed: true, destroyedAt: Date.now(),
              hash: remap?.get(blockHash) ?? m.hash
            };

          const moved = remap?.get(m.hash);

            // Trust-on-first-use, but only for a key the peer proves it holds
            // (see createKeyPinning). A changed key is either a reinstall or an
            // impersonation attempt: refuse it and make the user decide.
            const outcome = await keyPinning.onAnnounce(peerId, msg);
            if (outcome === 'invalid') {
              console.warn('[key-announce] ignoring malformed key from', peerId);
              return;
            }
            if (outcome === 'mismatch') {
              console.warn('[key-announce] pinned key mismatch for', peerId);
              addToast('A peer announced a different public key — ignored. Verify their safety number before trusting it.', 'error');
              return;
            }
            // Reply once so the initiator learns our key too (no reply storm).
            if (msg.wantReply) {
              try {
                const me = identityRef.current || identity;
                if (me?.publicKeyHex) {
                  conn.sendMessage(peerId, {
                    type: 'key-announce', publicKeyHex: me.publicKeyHex, name: me.name, wantReply: false
                  });
                }
              } catch (e) {console.warn('Key announce reply failed:', e);}
            }
            return;
          }

          if (msg.type === 'key-challenge') {
            await keyPinning.onChallenge(peerId, msg);
            return;
          }

          if (msg.type === 'key-proof') {
            if (!keyPinning.onProof(peerId, msg)) console.warn('[key-proof] unexpected or wrong proof from', peerId);
            return;
          }

          // Voice notes are only accepted from inside a sealed envelope (see the
          // chat branch below). A bare `voice` message means the audio crossed
          // the transport in the clear — the GMP bridge relays it whenever no
          // direct data channel exists, so it would be readable there.
          if (msg.type === 'voice') {
            console.warn('[voice] rejected unsealed voice payload from', peerId);
            addToast('Rejected an unencrypted voice message from a peer running an older build', 'warning');
            return;
          }

          if (msg.type === 'chat' || msg.type === 'queued-message') {
            const convoKey = getConvoKey(peerId);
            const convoMsgs = messages[convoKey] || [];
            // De-duplicate on the *sender's* hash: our own hash is computed over
            // our local chain position, so a redelivery would produce a
            // different one and slip past.
            if (msg.blockHash && convoMsgs.some((m) => m.remoteHash === msg.blockHash)) {
              return; // discard duplicate silently
            }

            // Unseal the ECIES envelope with our private key. Payloads that
            // arrive with a plaintext body (older peer builds) are rejected —
            // accepting them would silently re-open the plaintext wire format.
            let inner;
            if (msg.sealed) {
              try {
                inner = await unsealPayload(msg.sealed, identityRef.current || identity);
              } catch (e) {
                console.error('Failed to unseal incoming message from', peerId, e);
                addToast('Received a message that could not be decrypted', 'error');
                return;
              }
            } else {
              console.warn('[chat] rejected unsealed payload from', peerId);
              addToast('Rejected an unencrypted message from a peer running an older build', 'warning');
              return;
            }

            // Voice notes ride the same sealed envelope; route them to the voice
            // renderer rather than the text chain.
            if (inner.type === 'voice') {
              handleVoicePayload(inner);
              return;
            }

            const { content, msgType, meta, sender } = sanitizeInboundChat(inner, (identityRef.current || identity)?.name);
            const block = await chain.add(sender, content, msgType, meta);
            if (typeof msg.blockHash === 'string' && msg.blockHash) {
              // Keep our locally computed hash — it is what chains this block to
              // its predecessor here, and what verify() can check. The sender's
              // hash is recorded separately so redeliveries stay recognisable.
              block.remoteHash = msg.blockHash;
              block.isReceived = true;
            }
            // Re-encrypt at rest under this device's own vault key.
            block.encrypted = await CryptoEngine.encrypt(content, LocalVault.key());
            bumpChain();

            // Arm the sender's expiry on this copy too. Without this the message
            // self-destructed only on the device that wrote it, which is the one
            // copy the feature was not protecting.
            if (block.meta?.selfDestruct) {
              scheduleSelfDestruct(block.hash, block.meta.selfDestruct, block.ts);
            }

            const isDuplicate = (msgs, newBlock) =>
            msgs.some((m) => newBlock.remoteHash ? m.remoteHash === newBlock.remoteHash : m.hash === newBlock.hash);

            setMessages((prev) => {
              const convo = prev[convoKey] || [];
              if (isDuplicate(convo, block)) return prev;
              return { ...prev, [convoKey]: [...convo, block] };
            });
            setPeers((prev) => prev.map((p) =>
            (p.fingerprint === peerId || p.id === peerId) && convoKey !== activeConvoRef.current ?
            { ...p, unread: (p.unread || 0) + 1 } : p
            ));
            if (msg.type === 'queued-message') addToast('Offline message delivered', 'info');
            return;
          }

          if (msg.type === 'typing') {
            setTyping(true);
            setTimeout(() => setTyping(false), 3000);
          } else if (msg.type === 'reaction') {
            // Reactions are sealed like chat. An unsealed one is either a peer
            // on an older build or the bridge injecting/rewriting a reaction it
            // could read off the wire — neither is worth rendering.
            if (!msg.sealed) {
              console.warn('[reaction] rejected unsealed reaction from', peerId);
              return;
            }
            let reaction;
            try {
              reaction = await unsealPayload(msg.sealed, identityRef.current || identity);
            } catch (e) {
              console.error('[reaction] failed to unseal from', peerId, e);
              return;
            }
            // The peer names the message by the hash *it* knows: ours if we
            // wrote it (it holds that as remoteHash), its own if it wrote it
            // (we hold that as remoteHash). Resolve either to our local hash,
            // which is what the message list looks reactions up by.
            const wireHash = reaction?.messageHash;
            if (typeof wireHash !== 'string' || !wireHash) return;
            const target = chain.blocks.find((b) => b.hash === wireHash || b.remoteHash === wireHash);
            if (!target) return;
            setMessageReactions((prev) => applyInboundReaction(prev, target.hash, reaction.emoji, peerId));
          } else if (msg.type === 'call-offer' || msg.type === 'call-answer' || msg.type === 'call-ice' || msg.type === 'call-end') {
            // Call signals must be sealed and are routed by transport peer ID;
            // a payload's `from` is never trusted. call-end is sealed too, for
            // authenticity.
            if (!msg.sealed) {
              console.warn('[call] rejected unsealed call signal from', peerId);
              addToast('Rejected an unencrypted call signal from a peer running an older build', 'warning');
              return;
            }
            let signal;
            try {
              signal = await unsealPayload(msg.sealed, identityRef.current || identity);
            } catch (e) {
              console.error('[call] failed to unseal signal from', peerId, e);
              return;
            }

            if (msg.type === 'call-offer') {
              if (callActive && callConnectionRef.current && callConnectionRef.current.__peerId === peerId) {
                // This is a renegotiation offer (e.g., adding screen share track)
                const pc = callConnectionRef.current;
                pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: signal.sdp })).
                then(() => pc.createAnswer()).
                then((answer) => pc.setLocalDescription(answer)).
                then(() => sendCallSignal(peerId, {
                  type: 'call-answer',
                  sdp: pc.localDescription.sdp,
                  name: identity.name
                })).
                catch((e) => console.error('Renegotiation error:', e));

                if (signal.callType) {
                  setCallType(signal.callType);
                }
              } else {
                // Incoming call — show incoming call UI
                pendingCallOfferRef.current = { sdp: signal.sdp, callType: signal.callType || 'voice', from: peerId, fromName: signal.name };
                setIncomingCall({ peerId, callType: signal.callType || 'voice' });
                setCallType(signal.callType || 'voice');
                addToast(`Incoming ${signal.callType || 'voice'} call from ${signal.name || peerId}`, 'info');
              }
            } else if (msg.type === 'call-answer') {
              // Answer to our call offer — only from the peer we are calling.
              const pc = callConnectionRef.current;
              if (pc && pc.__peerId !== peerId) {
                console.warn('[call] ignoring answer from non-call peer', peerId);
                return;
              }
              if (pc && pc.signalingState !== 'stable') {
                pc.setRemoteDescription({ type: 'answer', sdp: signal.sdp }).catch((e) => console.error('call answer error:', e));
              }
            } else if (msg.type === 'call-ice') {
              const pc = callConnectionRef.current;
              if (pc && pc.__peerId !== peerId) {
                console.warn('[call] ignoring ICE from non-call peer', peerId);
                return;
              }
              if (pc && signal.candidate) {
                // signal.candidate is a deserialized plain object - wrap it in RTCIceCandidate
                try {
                  const cand = new RTCIceCandidate(signal.candidate);
                  pc.addIceCandidate(cand).catch((e) => console.error('call ICE error:', e));
                } catch (e) {
                  console.error('call ICE error (bad candidate):', e);
                }
              }
            } else if (msg.type === 'call-end') {
              // Peer ended the call — only the peer actually on the call may end it.
              if (callConnectionRef.current && callConnectionRef.current.__peerId !== peerId) {
                console.warn('[call] ignoring call-end from non-call peer', peerId);
                return;
              }
              if (callConnectionRef.current) {try {callConnectionRef.current.close();} catch {}callConnectionRef.current = null;}
              if (callLocalStreamRef.current) {callLocalStreamRef.current.getTracks().forEach((t) => t.stop());callLocalStreamRef.current = null;}
              setCallActive(false);
              setCallType(null);
              setLocalStream(null);
              setRemoteStreams({});
              setCallTimer(0);
              clearInterval(timerRef.current);
              addToast('Call ended by peer', 'info');
            }
          } else if (msg.type === 'workspace-chat') {
            const wsId = msg.workspaceId;
            const ns = window.GLLicenseRuntime;
            if (ns && ns.workspaceManager) {
              const ws = ns.workspaceManager.getWorkspace(wsId);
              if (ws) {
                // Same identity resolution as workspace-sync: the chain entry is
                // attributed to the mapped fingerprint, not to the sender's own
                // claim, and only members may append to a workspace chain.
                const senderFingerprint = identityForPeer(peerId);
                if (!senderFingerprint || !(ws.members || []).some((m) => m.id === senderFingerprint)) {
                  console.warn('[workspace-chat] rejected message from non-member', peerId);
                  return;
                }
                const newMsg = {
                  sender: msg.sender,
                  senderId: senderFingerprint,
                  encrypted: msg.encrypted,
                  type: msg.msgType || 'text',
                  meta: msg.meta || {},
                  ts: Date.now()
                };
                await ns.workspaceManager.addToChain(wsId, newMsg);
                setWorkspaces(ns.workspaceManager.getWorkspaces());
                if (activeConvoRef.current !== wsId) {
                  setWorkspaces((prev) => prev.map((w) => w.id === wsId ? { ...w, unread: (w.unread || 0) + 1 } : w));
                  addToast(`New message in workspace ${ws.name}`, 'info');
                }
              }
            }
          } else if (msg.type === 'workspace-sync') {
            const wsId = msg.workspaceId;
            const ns = window.GLLicenseRuntime;
            if (ns && ns.workspaceManager) {
              const ws = ns.workspaceManager.getWorkspace(wsId);
              if (ws) {
                // AUTHORIZATION GATE — workspace-sync mutates the roster, deletes
                // workspaces and swaps keys. The sender (by transport peer id,
                // mapped to a fingerprint) must be a current owner/admin.
                const senderFingerprint = identityForPeer(peerId);
                if (!senderFingerprint) {
                  console.warn('[workspace-sync] rejected: no pinned identity for transport peer', peerId);
                  return;
                }
                if (msg.senderId && msg.senderId !== senderFingerprint) {
                  console.warn('[workspace-sync] rejected: senderId does not match transport peer', msg.senderId, senderFingerprint);
                  return;
                }
                const senderRole = (ws.members || []).find((m) => m.id === senderFingerprint)?.role;
                if (senderRole !== 'owner' && senderRole !== 'admin') {
                  console.warn('[workspace-sync] rejected unauthorized control message from', senderFingerprint, '(role:', senderRole || 'non-member', ')');
                  return;
                }
                if (msg.action === 'remove-member') {
                  if (msg.targetId === identity.fingerprint) {
                    ns.workspaceManager.deleteWorkspace(wsId);
                    setWorkspaces(ns.workspaceManager.getWorkspaces());
                    if (activeConvoRef.current === wsId) setActiveConvo(null);
                    addToast(`You have been removed from workspace ${ws.name}`, 'warning');
                  } else {
                    ws.members = msg.members;
                    // Only accept a rotated key that was sealed to us. A plaintext
                    // `newKey` field is ignored — it would let anyone on the wire
                    // read (or substitute) the workspace key.
                    if (msg.sealedKey) {
                      try {
                        const { newKey } = await unsealPayload(msg.sealedKey, identityRef.current || identity);
                        if (newKey) ws.workspaceKey = newKey;
                      } catch (e) {
                        console.error('[workspace-sync] failed to unseal rotated key:', e);
                        addToast(`Could not read the rotated key for ${ws.name} — you may need to rejoin`, 'error');
                      }
                    }
                    ws.updatedAt = Date.now();
                    await ns.workspaceManager._saveWorkspaces();
                    setWorkspaces(ns.workspaceManager.getWorkspaces());
                    addToast(`Workspace ${ws.name} members roster rotated`, 'info');
                  }
                } else if (msg.action === 'new-member') {
                  if (!ws.members.some((m) => m.id === msg.member.id)) {
                    ws.members.push(msg.member);
                    ws.updatedAt = Date.now();
                    await ns.workspaceManager._saveWorkspaces();
                    setWorkspaces(ns.workspaceManager.getWorkspaces());
                    addToast(`New member joined workspace ${ws.name}`, 'info');
                  }
                }
              }
            }
          }
        } catch (e) {console.error('Message parse error:', e);}
      });
    };

    // Owns the single connect() attempt plus everything that must happen once the
    // transport is up. Callers that already ran their own timed connect() pass
    // { connect: false } so a second socket is never opened.
    const connectAndInit = async (conn, { connect = true } = {}) => {
      try {
        if (connect) await conn.connect();

        // Wire GhostLinkDebug. The bridge socket is `conn.ws`.
        if (window.GhostLinkDebug) {
          window.GhostLinkDebug.setConnectionManager(conn);
          window.GhostLinkDebug.setSignalManager({
            isConnected: () => !!conn.ws && conn.ws.readyState === WebSocket.OPEN,
            _wsUrl: getBridgeWsUrl(),
            peers: () => Object.keys(conn.knownPeers || {}),
            _myRoom: null
          });
        }

        // Initialize encrypted file transfer over WebRTC files channel
        if (typeof FileTransfer === 'undefined') {
          await import('./src/p2p/file-transfer.js');
        }
        if (typeof FileTransfer !== 'undefined' || typeof GhostLinkP2P !== 'undefined' && GhostLinkP2P.FileTransfer) {
          const FT = FileTransfer || GhostLinkP2P.FileTransfer;
          const ft = new FT(conn, CryptoEngine, {
            getPeerPublicKey: (peerId) => getPeerPublicKey(peerId),
            getPrivateKey: () => (identityRef.current || identity)?.keyPair?.privateKey || null
          });
          ft.on('complete', ({ peerId, file }) => {
            const peerName = peersRef.current.find((p) => p.fingerprint === peerId || p.id === peerId)?.name || 'Peer';
            setTransferredFiles((prev) => [...prev, {
              name: file.name,
              size: file.size,
              from: peerName,
              ts: Date.now(),
              url: file.url,
              mimeType: file.type,
              encrypted: true,
              peerId
            }]);
            addToast(`File received: ${file.name}`, 'success');
          });
          ft.on('error', ({ error }) => {
            console.error('[FileTransfer]', error);
            addToast('File receive failed: ' + error, 'error');
          });
          fileTransferManagerRef.current = ft;
          setFileTransferManager(ft);
        }

        // Restore cached peers as offline initially
        const cached = PeerCache.getAllPeers();
        const cachedIds = Object.keys(cached);
        const meshPeersCache = loadPersisted('gl_mesh_peers', {});
        if (cachedIds.length > 0) {
          setAutoReconnectStatus('trying-relay');
          for (const pid of cachedIds) {
            const c = cached[pid];
            setPeers((prev) => {
              if (prev.find((p) => p.fingerprint === pid || p.id === pid)) return prev;
              return [...prev, {
                id: pid, name: c.name || `Peer-${pid.slice(0, 6)}`, status: 'offline',
                pubKey: c.publicKeyHex || c.pubKeyHex || '', lastSeen: 'cached',
                avatar: (c.name || 'P').split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase(),
                color: PALETTE.graphite, unread: 0, fingerprint: pid, isReal: true, isCached: true
              }];
            });
            // Auto-dial Yggdrasil peers on start in Electron
            if (localStorage.getItem('gl_yggdrasil_enabled') === 'true' && window.ghostlink?.isElectron) {
              const mp = meshPeersCache[pid];
              if (mp && mp.yggdrasilAddress) {
                console.debug(`[GhostMesh] Auto-dialing cached mesh peer ${pid} at ${mp.yggdrasilAddress}`);
                dialMeshPeer(conn, pid, mp.yggdrasilAddress);
              }
            }
          }
        }
      } catch (e) {
        console.warn('[GhostLink] Signaling connect failed (will auto-reconnect):', e.message);
        setSignalingAvailable(false);
        const cached = PeerCache.getAllPeers();
        const meshPeersCache = loadPersisted('gl_mesh_peers', {});
        for (const pid of Object.keys(cached)) {
          const c = cached[pid];
          setPeers((prev) => {
            if (prev.find((p) => p.fingerprint === pid || p.id === pid)) return prev;
            return [...prev, {
              id: pid, name: c.name || `Peer-${pid.slice(0, 6)}`, status: 'offline',
              pubKey: c.publicKeyHex || c.pubKeyHex || '', lastSeen: 'cached',
              avatar: (c.name || 'P').split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase(),
              color: PALETTE.graphite, unread: 0, fingerprint: pid, isReal: true, isCached: true
            }];
          });
          // Auto-dial Yggdrasil peers on start in Electron even if signaling is down
          if (localStorage.getItem('gl_yggdrasil_enabled') === 'true' && window.ghostlink?.isElectron) {
            const mp = meshPeersCache[pid];
            if (mp && mp.yggdrasilAddress) {
              console.debug(`[GhostMesh] Auto-dialing cached mesh peer ${pid} at ${mp.yggdrasilAddress} (signaling down)`);
              dialMeshPeer(conn, pid, mp.yggdrasilAddress);
            }
          }
        }
        setTimeout(() => setAutoReconnectStatus('waiting'), 5000);
      }
      return;
    };

    // Bring up the Ghost Mesh transport. If it is not up yet we wait;
    // GMPBridgeConnector reconnects indefinitely and restores sessions.
    let initP2PAttempts = 0;
    const initP2P = async () => {
      if (cancelled) return;

      // connectAndInit wires the debug console, file transfer and the global
      // event bus, all of which live in app.bundle.js. Give the bundle a few
      // seconds to land — but start the mesh regardless if it never does,
      // because messaging matters more than the debug wiring.
      if (!window.GhostLink && initP2PAttempts++ < 10) {
        initRetryTimer = setTimeout(() => {
          initRetryTimer = null;
          if (!cancelled && !p2pConnectorRef.current) initP2P();
        }, 300);
        return;
      }

      const bridgeConn = new GMPBridgeConnector(identity);
      // Listeners first — the bridge emits 'started'/'peer-connected' as soon as
      // the socket opens, and those must not be missed.
      setupEvents(bridgeConn);
      bridgeConn.on('mesh-identity', ({ ghostAddress, nodeId }) => {
        if (ghostAddress) setGhostAddress(ghostAddress);
        if (nodeId) setMeshNodeId(nodeId);
      });
      bridgeConn.on('mesh-status', (status) => setMeshStatus(status));
      bridgeConn.on('storage-status', (status) => setStorageStatus(status));
      bridgeConn.on('sf-state', ({ localId, state, reason }) => {
        setMessages((prev) => {
          const next = {};
          for (const [k, convo] of Object.entries(prev)) {
            next[k] = convo.map((m) => {
              if (m.hash !== localId) return m;
              if (state === 'failed') return { ...m, deliveryState: undefined, sendFailed: true, sendFailedReason: `Not stored: ${reason || 'the mailbox refused it'}` };
              return { ...m, deliveryState: state };
            });
          }
          return next;
        });
        if (state === 'failed') addToast(`Not stored: ${reason || 'the mailbox refused it'}`, 'error');
      });

      // Publish the connector before awaiting: the socket may take a while on a
      // cold start, and everything else (invite screen, send paths) needs to be
      // able to find it and await waitUntilReady() rather than seeing null.
      p2pConnectorRef.current = ownedConnector = bridgeConn;
      setPeerManager(bridgeConn);
      setConnectionMode('Ghost Mesh — connecting');

      // Wire the managers (file transfer, debug console, cached contacts) up
      // front, before the socket is up. They do not need it, and hanging them
      // off a successful first connect would mean a slow-starting mesh left the
      // app permanently half-initialised even after the retry succeeded.
      await connectAndInit(bridgeConn, { connect: false });
      if (cancelled) {try {bridgeConn.destroy();} catch (e) {}return;}

      try {
        await bridgeConn.connect();
        if (cancelled) {try {bridgeConn.destroy();} catch (e) {}return;}
        setSignalingAvailable(true);
        console.debug('[GMP] Ghost Mesh transport established.');
      } catch (e) {
        if (cancelled) {try {bridgeConn.destroy();} catch (err) {}return;}
        // Not a failure state the user has to act on — connect() has already
        // scheduled its own retry, and 'started' will arrive when the node is up.
        console.warn('[GMP] Ghost Mesh not up yet, retrying in background:', e.message);
        setConnectionMode('Ghost Mesh — connecting');
        setSignalingAvailable(false);
      }
    };

    // Initialize QR invite
    const initQR = async () => {
      if (typeof QRInvite !== 'undefined') {
        const qi = new QRInvite({
          publicKeyHex: identity.publicKeyHex,
          name: identity.name,
          fingerprint: identity.fingerprint,
          keyPair: identity.keyPair || null
        });
        qrInviteRef.current = qi;
        setQrInviteData(qi);
      }
    };

    initP2P();
    initQR();

    return () => {
      cancelled = true;
      if (initRetryTimer) {
        clearTimeout(initRetryTimer);
        initRetryTimer = null;
      }
      if (ownedConnector) {
        // destroy(), not disconnect(): the latter only ends the bridge session
        // and would leave peer connections, data channels and listeners alive.
        try {
          if (typeof ownedConnector.destroy === 'function') ownedConnector.destroy();
          else ownedConnector.disconnect();
        } catch (e) {}
        // Only release the shared ref if nothing else has replaced it.
        if (p2pConnectorRef.current === ownedConnector) p2pConnectorRef.current = null;
        ownedConnector = null;
      }
    };
  }, [identity, settings.relayServerUrl]);

  // Initialize Notification, Alert, and Markdown managers when identity is ready
  useEffect(() => {
    if (!identity) return;

    // Sound Generator
    const sg = new window.SoundGenerator();
    sg.setVolume(0.3);
    setSoundGenerator(sg);

    // Notification Manager (privacy-preserving)
    const nm = new window.NotificationManager();
    setNotifManager(nm);

    // In-App Alert Manager
    const am = new window.InAppAlertManager({
      soundGenerator: sg,
      notificationManager: nm,
      onUnreadChange: (count) => {
        setPeers((prev) => prev.map((p) =>
        p.unread > 0 && p.id === activeConvo ? p : p
        ));
      }
    });
    setAlertManager(am);

    // Markdown Engine (Phase 3)
    const mp = new window.MarkdownParser();
    setMarkdownParser(mp);
    const sanitizer = window.sanitizeHTML || function (html) {
      // Fallback if sanitize module not loaded
      const div = document.createElement('div');
      div.textContent = html;
      return div.innerHTML;
    };
    setHtmlSanitizer(() => sanitizer);

    // Test markdown parsing
    try {
      const test = mp.parse('**bold** and *italic*');
      if (!test || typeof test !== 'string') {
        console.warn('[GhostLink] Markdown parser may not be initialized');
      }
    } catch (e) {
      console.warn('[GhostLink] Markdown parser error:', e);
    }

    return () => {
      sg?.destroy?.();
      nm?.destroy?.();
      am?.destroy?.();
    };
  }, [identity]);

  // ==================== ACTIONS ====================
  const initSetup = async () => {
    if (!displayName.trim()) return;
    const seed = await generateSeedPhrase();
    setPendingSeed(seed);
    setSeedPhrase(seed);
    setSetupStep("seed");
  };

  /**
   * First-run setup: hand the node its seed and wait for it to come up,
   * retrying refused connections while the freshly launched node binds.
   */
  const attemptGmpSetup = async (seed) => {
    setGmpSetupStatus("connecting");

    const deadline = Date.now() + 25000;
    let attempt = 0;

    const tryOnce = () => new Promise((resolve) => {
      let settled = false;
      const finish = (ok) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        resolve(ok);
      };

      let ws;
      try {
        ws = new WebSocket(getBridgeWsUrl());
      } catch (e) {
        resolve(false);
        return;
      }

      const timer = setTimeout(() => {
        try {ws.close();} catch (e) {}
        finish(false);
      }, 8000);

      ws.onopen = () => {
        const start = { type: 'start', port: getGmpPort() };
        // Never hand the recovery phrase to a bridge target chosen by the URL.
        if (isTrustedBridgeTarget()) {
          start.seedPhrase = seed.join(" ");
        } else {
          console.warn('[GMP Setup] Remote bridge target — withholding recovery phrase. ' +
          'Configure the seed on the bridge host via GMP_SEED_PHRASE.');
        }
        ws.send(JSON.stringify(start));
      };

      ws.onmessage = (evt) => {
        try {
          const msg = JSON.parse(evt.data);
          if (msg.type === 'started') {
            localStorage.setItem('gl_gmp_mode', 'active');
            if (msg.ghostAddress) setGhostAddress(msg.ghostAddress);
            if (msg.nodeId) setMeshNodeId(msg.nodeId);
            try {ws.close();} catch (e) {}
            finish(true);
          }
        } catch (e) {}
      };

      ws.onerror = () => finish(false);
      ws.onclose = () => finish(false);
    });

    while (Date.now() < deadline) {
      attempt++;
      if (await tryOnce()) {
        setView("main");
        return;
      }
      console.debug(`[GMP Setup] Mesh not up yet (attempt ${attempt}), retrying...`);
      await new Promise((r) => setTimeout(r, 1500));

  };

  const retryGmpSetup = () => {

  const setupIdentity = async () => {
    const seed = pendingSeed;
    if (!seed) return;
    const { keyPair, publicKeyHex } = await CryptoEngine.generateKeyPair();
    const fp = await fingerprintFromPublicKey(publicKeyHex);
    const masterKey = await CryptoEngine.deriveKeyFromSeed(seed);
    // New identity: this seed is by definition the right one for this install.
    await unlockHistoryVault(seed);
    const identityObj = { keyPair, publicKeyHex, fingerprint: fp, name: displayName.trim() };
    const blobStr = await buildBackupBlob(identityObj, masterKey, { messages: {}, contacts: [], settings: {}, chain: [], files: [] });
    const fragments = generateBackupFragments(blobStr);
    const blobParsed = JSON.parse(blobStr);
    localStorage.setItem("gl_identity", JSON.stringify({
      name: blobParsed.name, pubKeyHex: blobParsed.pubKeyHex, fingerprint: blobParsed.fingerprint, wrappedPrivKey: blobParsed.wrappedPrivKey
    }));
    setShamirFragments(fragments);
    setIdentity(identityObj);

    if (window.ghostlink?.isElectron) {
      try {
        await window.ghostlink.gmp.start(seed.join(" "));

        console.error('[GMP Setup] Failed to save seed to Electron store:', err);
