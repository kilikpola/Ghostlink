buildscript {
    ext {
        // Native modules that cannot find the hoisted react-native read this.
        REACT_NATIVE_NODE_MODULES_DIR = new File(gradle.ext.nodeModulesDir, "react-native").absolutePath

        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        // NDK 26 for RN 0.73: Reanimated 3.6 builds with -Werror and NDK 27's
        // Clang adds warnings it trips. Do not raise without bumping Reanimated.
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.8.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
