    <script>
      /* ── THE PALETTE ──────────────────────────────────────────────────────
         The single source of colour for GhostLink. Nothing else in this file
         carries a raw colour value: every surface, border, accent and state
         below resolves back to one of these tokens. The CSS custom properties
         are emitted from the same object, so the stylesheet cannot drift away
         from the JavaScript that drives the components. */
      const PALETTE = {
        // Backgrounds — blue-tinted near-black, never pure black
        obsidian:     '#0B0F17',   // app background
        slate:        '#151B26',   // cards, panels, surfaces
        graphite:     '#1F2733',   // elevated surfaces, inputs
        divider:      '#2B3543',   // borders, separators

        // Text
        frost:        '#E8EDF4',   // primary
        mist:         '#8B95A5',   // secondary / muted
        fade:         '#5A6577',   // disabled, placeholder

        // Accents
        spectral:     '#4FE3B0',   // primary: secure, verified, connected, send
        spectralDim:  '#2FA37D',   // pressed / active
        spectralGlow: 'rgba(79,227,176,0.12)',
        hairline:     'rgba(43,53,67,0.35)',   // divider at low alpha: grid lines, hairline rules  // subtle fills

        signal:       '#8CFFD4',   // links, info, encryption + chain tags (lit end of the green ramp)
        amber:        '#FFB84D',   // warning, Pro tier, locked
        crimson:      '#FF5F6D',   // danger, errors, end call, self-destruct

        // Light surfaces
        paper:        '#FAFBFC',
        cloud:        '#F1F4F8',
        ink:          '#0B0F17',

        // Tinted fills for the semantic accents, so a status panel can be
        // washed in its own colour without any call site inventing an rgba().
        signalGlow:   'rgba(140,255,212,0.12)',
        amberGlow:    'rgba(255,184,77,0.12)',
        crimsonGlow:  'rgba(255,95,109,0.12)',

        // Depth comes from a neutral shadow, never a coloured glow.
        shadow:       'rgba(0,0,0,0.4)',
        shadowSoft:   'rgba(0,0,0,0.25)',
        scrim:        'rgba(0,0,0,0.85)',   // modal backdrops
      };
      // --obsidian, --spectral-dim, --spectral-glow, ...
      for (const [k, v] of Object.entries(PALETTE)) {
        document.documentElement.style.setProperty(
          '--' + k.replace(/[A-Z]/g, (m) => '-' + m.toLowerCase()), v);
      }
    </script>
    <script>
      /* Defensive stub. Some browser wallet/privacy extensions inject
         `window.ethereum.selectedAddress = ...` into every page they load.
         GhostLink is not a Web3 app and never provides a wallet, so on this
         page `window.ethereum` is undefined and that injected assignment throws
         "TypeError: undefined is not an object". Predefine a harmless, writable
         placeholder so the injected code no-ops instead of crashing the page.
         Guarded so the stub itself can never break anything. */
      (function () {
        try {
          if (typeof window.ethereum === "undefined") {
            Object.defineProperty(window, "ethereum", {
              value: { selectedAddress: undefined, isGhostLinkStub: true },
              writable: true,
              configurable: true
            });
          }
        } catch (e) { /* ignore: a real provider already owns window.ethereum */ }
      })();

    <script>
      (function() {
        const origLog = console.log;
        const origError = console.error;
        window.errs = [];
        let logging = false;
        window.onerror = function(msg, url, line, col, error) {
          if (logging) return false;
          logging = true;
          try {
            window.errs.push({type: 'error', msg, url, line, col, stack: error?.stack});
            showDebug();
          } catch (e) {
            origError.call(console, 'Error inside window.onerror:', e);
          } finally {
            logging = false;
          }
          return false;
        };
        window.onunhandledrejection = function(event) {
          if (logging) return;
          logging = true;
          try {
            window.errs.push({type: 'promise', msg: event.reason?.message || event.reason, stack: event.reason?.stack});
            showDebug();
          } catch (e) {
            origError.call(console, 'Error inside window.onunhandledrejection:', e);
          } finally {
            logging = false;
          }
        };
        console.log = function(...args) {
          origLog.apply(console, args);
          if (logging) return;
          logging = true;
          try {
            window.errs.push({type: 'log', text: args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ')});
            showDebug();
          } catch (e) {
          } finally {
            logging = false;
          }
        };
        console.error = function(...args) {
          origError.apply(console, args);
          if (logging) return;
          logging = true;
          try {
            window.errs.push({type: 'error', text: args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ')});
            showDebug();
          } catch (e) {
          } finally {
            logging = false;
          }
        };
        function showDebug() {
          const errors = window.errs.filter(e => e.type === 'error' || e.type === 'promise');
          if (errors.length === 0) {
            const existing = document.getElementById('debug-reporter');
            if (existing) existing.remove();
            return;
          }
          let div = document.getElementById('debug-reporter');
          if (!div) {
            div = document.createElement('div');
            div.id = 'debug-reporter';
            div.style.position = 'fixed';
            div.style.bottom = '0';
            div.style.left = '0';
            div.style.right = '0';
            div.style.height = '300px';
            div.style.background = PALETTE.slate;
            div.style.color = PALETTE.crimson;
            div.style.fontFamily = 'monospace';
            div.style.overflow = 'auto';
            div.style.padding = '10px';
            div.style.zIndex = '999999';
            div.style.borderTop = '2px solid red';
            if (document.body) {
              document.body.appendChild(div);
            } else {
              window.addEventListener('DOMContentLoaded', () => {
                if (window.errs.filter(e => e.type === 'error' || e.type === 'promise').length > 0) {
                  document.body.appendChild(div);
                  showDebug();
                }
              });
              return;
            }
          }
          /* Built as text nodes, never as HTML. Everything rendered here is
             captured log output, and console.error is overridden above, so
             peer-controlled strings reach this function routinely: a JSON parse
             failure embeds a slice of the offending payload in its message,
             unseal and decode failures quote remote values, and error text from
             the transport carries whatever the far side sent. Parsing that as
             HTML would let a peer inject an inline event handler into the page
             that holds the private key and the decrypted history — and
             script-src 'unsafe-inline' permits inline handlers, so the CSP does
             not stop it. */
          div.replaceChildren(...errors.map(e => {
            const row = document.createElement('div');
            const parts = ['[' + e.type + ']', e.msg || e.text || ''];
            if (e.url) parts.push('in ' + e.url);
            if (e.line) parts.push('line ' + e.line + ':' + e.col);
            row.textContent = parts.join(' ');
            if (e.stack) {
              const pre = document.createElement('pre');
              pre.textContent = e.stack;
              row.appendChild(pre);
            }
            return row;
          }));
        }
      })();
    </script>

import React, { useState, useEffect, useRef, useCallback, useMemo } from 'react';
import { createRoot } from 'react-dom/client';
import htm from 'htm';
const html = htm.bind((type, props, ...children) => {
  return React.createElement(type === '' ? React.Fragment : type, props, ...children);
});

window.GLLicenseAPI = window.GhostLink;
const GLLicenseAPI = window.GLLicenseAPI || {};
let _licenseInitPromise = null;

async function computeDeviceId(pubKeyHex) {
  if (!pubKeyHex || !crypto?.subtle) return '';
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pubKeyHex));
  return Array.from(new Uint8Array(hash)).map((b) => b.toString(16).padStart(2, '0')).join('');
}

async function resolveDeviceId(identity) {
  try {
    if (identity?.publicKeyHex) return await computeDeviceId(identity.publicKeyHex);
    const raw = localStorage.getItem('gl_identity');
    if (raw) {
      const d = JSON.parse(raw);
      const hex = d.pubKeyHex || d.publicKeyHex;
      if (hex) return await computeDeviceId(hex);
    }
    if (GLLicenseAPI.DeviceFingerprintManager) {
      const fp = new GLLicenseAPI.DeviceFingerprintManager();
      return await fp.getFingerprint();
    }
  } catch (err) {
    console.error('[GhostLink] Device ID error:', err);
  }
  return '';
}

async function bootstrapLicenseSystem() {
  const GL = GLLicenseAPI;
  const deviceFP = new GL.DeviceFingerprintManager();
  const validator = new GL.LicenseValidator({ deviceFingerprint: deviceFP });
  const licenseManager = new GL.LicenseManager({ validator, deviceFingerprint: deviceFP });
  const featureGate = new GL.FeatureGateManager({ licenseManager });
  await licenseManager.init();
  featureGate.setLicenseManager(licenseManager);
  return { deviceFingerprint: deviceFP, validator, licenseManager, featureGate };
}

async function ensureLicenseSystem() {
  if (window.GLLicenseRuntime?.licenseManager) return window.GLLicenseRuntime;

  if (!_licenseInitPromise) {
    _licenseInitPromise = (async () => {
      const GL = GLLicenseAPI;
      if (typeof GL.initLicenseSystem === 'function') {
        try {
          const system = await GL.initLicenseSystem({});
          window.GLLicenseRuntime = system;
          return system;
        } catch (err) {
          console.warn('[GhostLink] initLicenseSystem failed, using bootstrap:', err.message);
        }
      }
      if (GL.LicenseManager && GL.LicenseValidator) {
        const system = await bootstrapLicenseSystem();
        window.GLLicenseRuntime = system;
        return system;
      }
      throw new Error('License scripts failed to load — refresh via http://localhost:8000');
    })().catch((err) => {
      _licenseInitPromise = null;
      throw err;
    });
  }
  return _licenseInitPromise;
}

// ==================== CONSTANTS (outside component) ====================
const MSG_STORAGE_KEY = 'gl_messages';
const CHAIN_STORAGE_KEY = 'gl_chain';
const SETTINGS_STORAGE_KEY = 'gl_settings';
// { peerId: publicKeyHex } — the key that was actually compared during a
// verification ceremony. Storing the key rather than a boolean means the badge
// cannot survive the peer's key changing. Public data, so it stays unencrypted.
const VERIFIED_STORAGE_KEY = 'gl_verified_contacts';

const loadPersisted = (key, fallback) => {
  try {const d = localStorage.getItem(key);return d ? JSON.parse(d) : fallback;} catch {return fallback;}
};
const savePersisted = (key, data) => {
  try {localStorage.setItem(key, JSON.stringify(data));} catch (e) { console.warn(`[Storage] Failed to save ${key}:`, e.message); }
};
const clearPersisted = (key) => {
  try {localStorage.removeItem(key);} catch (e) { console.warn(`[Storage] Failed to clear ${key}:`, e.message); }
};

const retentionFilter = (messages, retentionDays) => {
  if (!retentionDays || retentionDays <= 0) return messages;
  const cutoff = Date.now() - retentionDays * 86400000;
  const result = {};
  for (const [convo, msgs] of Object.entries(messages)) {
    const filtered = msgs.filter(m => m.ts > cutoff);
    if (filtered.length) result[convo] = filtered;
  }
  return result;
};

let BIP39_WORDS = null;
const EMOJIS = ["😀", "😂", "😍", "🥰", "😎", "🤔", "😤", "😭", "🥺", "😅", "🙏", "👍", "👎", "❤️", "🔥", "✅", "⚡", "🎉", "👀", "💀", "🤝", "🚀", "💡", "🔒", "⚠️", "📎", "📁", "🛡️", "🌐", "💬"];

// ==================== CRYPTO ENGINE ====================
const CryptoEngine = {
  async generateKeyPair() {
    const kp = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);
    const raw = await crypto.subtle.exportKey("raw", kp.publicKey);
    const hex = Array.from(new Uint8Array(raw)).map((b) => b.toString(16).padStart(2, "0")).join("");
    return { keyPair: kp, publicKeyHex: hex };
  },
  async sha256(d) {
    const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(d));
    return Array.from(new Uint8Array(h)).map((b) => b.toString(16).padStart(2, "0")).join("");
  },
  // ==================== SYMMETRIC ENCRYPTION AT REST ====================
  // v2: HKDF-SHA256 over a high-entropy key with a random per-message salt.
  // Passphrases belong in deriveKeyFromSeed (PBKDF2) instead. v1 ciphertext
  // (raw padded key) is still readable and migrates to v2 when rewritten.
  CIPHER_VERSION: 2,
  _HKDF_INFO: "ghostlink-at-rest-v2",

  _hex(bytes) {
    return Array.from(bytes).map((b) => b.toString(16).padStart(2, "0")).join("");
  },
  _unhex(hex) {
    return new Uint8Array(hex.match(/.{2}/g).map((b) => parseInt(b, 16)));
  },

  /** v2: HKDF-SHA256(key, salt) -> AES-GCM-256. */
  async _deriveAtRestKey(key, salt, usage) {
    const material = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(String(key)), "HKDF", false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      {
        name: "HKDF",
        hash: "SHA-256",
        salt,
        info: new TextEncoder().encode(this._HKDF_INFO)
      },
      material,
      { name: "AES-GCM", length: 256 },
      false,
      usage
    );
  },

  /** v1: the key string used as raw AES material. Read-only — never written. */
  async _legacyAtRestKey(key, usage) {
    return crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(String(key).padEnd(32, "0").slice(0, 32)),
      "AES-GCM",
      false,
      usage
    );
  },

  async encrypt(text, key) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const ck = await this._deriveAtRestKey(key, salt, ["encrypt"]);
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, ck, new TextEncoder().encode(text));
    return {
      v: this.CIPHER_VERSION,
      salt: this._hex(salt),
      iv: this._hex(iv),
      ciphertext: this._hex(new Uint8Array(ct))
    };
  },

  /** True if this blob predates the KDF and should be rewritten when convenient. */
  isLegacyCiphertext(encObj) {
    return !!encObj && typeof encObj === "object" && !encObj.v;
  },
  genInvite() {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const bytes = crypto.getRandomValues(new Uint8Array(9));
    const part1 = Array.from(bytes.slice(0, 3)).map((b) => chars[b % chars.length]).join("");
    const part2 = Array.from(bytes.slice(3, 6)).map((b) => chars[b % chars.length]).join("");
    const part3 = Array.from(bytes.slice(6, 9)).map((b) => chars[b % chars.length]).join("");
    return `GHOST-${part1}-${part2}-${part3}`;
  },
  // URL-safe base64 encode (replaces deprecated unescape/escape)
  _base64Encode(str) {
    try {
      return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
      (_, p1) => String.fromCharCode(parseInt(p1, 16))));
    } catch (e) {
      return btoa(str);
    }
  },
  _base64Decode(str) {
    try {
      return decodeURIComponent(Array.from(atob(str)).map((c) =>
      '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join(''));
    } catch (e) {
      return atob(str);
    }
  },
  async deriveKeyFromSeed(words) {
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey("raw", enc.encode(words.join(" ")), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: enc.encode("ghostlink-v2-salt"), iterations: 100000, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["wrapKey", "unwrapKey"]
    );
  },
  // Key for message history at rest. Deliberately a separate derivation from
  // deriveKeyFromSeed (different salt, different usages) so the private-key
  // wrapping key and the storage key are never the same bytes.
  async deriveStorageKey(words) {
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey("raw", enc.encode(words.join(" ")), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: enc.encode("ghostlink-storage-v1"), iterations: 200000, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
    );
  },
  async wrapPrivKey(privKey, wrapKey) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const wrapped = await crypto.subtle.wrapKey("pkcs8", privKey, wrapKey, { name: "AES-GCM", iv });
    return {
      iv: [...iv].map((b) => b.toString(16).padStart(2, "0")).join(""),
      data: [...new Uint8Array(wrapped)].map((b) => b.toString(16).padStart(2, "0")).join("")
    };
  },
  async unwrapPrivKey(w, wrapKey) {
    const iv = new Uint8Array(w.iv.match(/.{2}/g).map((b) => parseInt(b, 16)));
    const data = new Uint8Array(w.data.match(/.{2}/g).map((b) => parseInt(b, 16)));
    return crypto.subtle.unwrapKey("pkcs8", data, wrapKey, { name: "AES-GCM", iv }, { name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);
  },
  async decrypt(encObj, key) {
    if (!encObj || typeof encObj !== "object" || !encObj.iv || !encObj.ciphertext) {
      throw new Error("decrypt: not an encrypted block");
    }
    const iv = this._unhex(encObj.iv);
    const ct = this._unhex(encObj.ciphertext);

    // An untagged blob is v1, from before the KDF existed. Read it with the
    // old scheme so history survives; writes always produce v2.
    const ck = encObj.v === 2 && encObj.salt
      ? await this._deriveAtRestKey(key, this._unhex(encObj.salt), ["decrypt"])
      : await this._legacyAtRestKey(key, ["decrypt"]);

    const dec = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, ck, ct);
    return new TextDecoder().decode(dec);
  },
  async encryptWithPublicKey(plaintext, pubKeyHex) {
    const keyBytes = new Uint8Array(pubKeyHex.match(/.{2}/g).map((byte) => parseInt(byte, 16)));
    const recipientPubKey = await crypto.subtle.importKey(
      "raw",
      keyBytes,
      { name: "ECDH", namedCurve: "P-256" },
      true,
      []
    );
    const ephemeral = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);
    const sharedSecret = await crypto.subtle.deriveKey(
      {
        name: "ECDH",
        public: recipientPubKey
      },
      ephemeral.privateKey,
      {
        name: "AES-GCM",
        length: 256
      },
      true,
      ["encrypt", "decrypt"]
    );
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const textBytes = new TextEncoder().encode(plaintext);
    const ciphertext = await crypto.subtle.encrypt(
      { name: "AES-GCM", iv },
      sharedSecret,
      textBytes
    );
    const ephemeralRaw = await crypto.subtle.exportKey("raw", ephemeral.publicKey);
    const ephemeralPubKeyHex = Array.from(new Uint8Array(ephemeralRaw)).map((b) => b.toString(16).padStart(2, "0")).join("");
    return {
      ephemeralPubKeyHex,
      ivHex: Array.from(iv).map((b) => b.toString(16).padStart(2, "0")).join(""),
      ciphertextHex: Array.from(new Uint8Array(ciphertext)).map((b) => b.toString(16).padStart(2, "0")).join("")
    };
  },
  async decryptWithPrivateKey(encBundle, privateKey) {
    const ephemeralRawBytes = new Uint8Array(encBundle.ephemeralPubKeyHex.match(/.{2}/g).map((byte) => parseInt(byte, 16)));
    const ephemeralPubKey = await crypto.subtle.importKey(
      "raw",
      ephemeralRawBytes,
      { name: "ECDH", namedCurve: "P-256" },
      true,
      []
    );
    const sharedSecret = await crypto.subtle.deriveKey(
      {
        name: "ECDH",
        public: ephemeralPubKey
      },
      privateKey,
      {
        name: "AES-GCM",
        length: 256
      },
      true,
      ["encrypt", "decrypt"]
    );
    const iv = new Uint8Array(encBundle.ivHex.match(/.{2}/g).map((b) => parseInt(b, 16)));
    const ciphertext = new Uint8Array(encBundle.ciphertextHex.match(/.{2}/g).map((b) => parseInt(b, 16)));
    const decryptedBytes = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv },
      sharedSecret,
      ciphertext
    );
    return new TextDecoder().decode(decryptedBytes);
  },
  /**
   * Derive the legacy Yggdrasil IPv6 address for a seed phrase.
   *
   * ⚠ MUST NOT BE USED TO DERIVE A GHOST ADDRESS OR ANY IDENTITY. ⚠
   *
   * A routing address for a self-hosted Yggdrasil daemon, used only by the
   * manual Ghost Mesh setup panel. Its KDF differs from identity derivation:
   *
   *   this function        PBKDF2-HMAC-SHA256, salt "ghostlink-yggdrasil-v1"
   *   Ghost Address        PBKDF2-HMAC-SHA512, salt "ghostlink-yggdrasil-v1"
   *                        (gmp-core/src/identity.ts, mobile/src/utils/crypto.js)
   *
   * test/ghost-address-kdf.test.mjs fails if a Ghost Address path uses SHA-256.
   *
   * @param {string[]} words the recovery phrase
   * @returns {Promise<{publicKeyHex: string, address: string, privateKeyHex: string}>}
   */
  async deriveLegacyYggdrasilIP(words) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      "raw",
      enc.encode(words.join(" ")),
      "PBKDF2",
      false,
      ["deriveBits"]
    );
    const derivedBits = await crypto.subtle.deriveBits(
      {
        name: "PBKDF2",
        salt: enc.encode("ghostlink-yggdrasil-v1"),
        iterations: 100000,
        hash: "SHA-256"
      },
      baseKey,
      256
    );
    const rawKeyBytes = new Uint8Array(derivedBits);

    const publicKeyBytes = await this.curve25519PublicKeyFromSeed(rawKeyBytes);
    const address = await this._legacyYggdrasilIPFromKey(publicKeyBytes);
    const publicKeyHex = Array.from(publicKeyBytes).map((b) => b.toString(16).padStart(2, "0")).join("");
    const privateKeyHex = Array.from(rawKeyBytes).map((b) => b.toString(16).padStart(2, "0")).join("");

    return { publicKeyHex, address, privateKeyHex };
  },
  async curve25519PublicKeyFromSeed(seedBytes) {
    // Primary path: use tweetnacl (nacl-fast.min.js exposes as window.nacl)
    // nacl.box.keyPair.fromSecretKey performs X25519 (Curve25519) scalar
    // multiplication of the private key against the standard base point (9),
    // producing the correct 32-byte Curve25519 public key.
    if (typeof nacl !== 'undefined' && nacl.box) {
      try {
        const keyPair = nacl.box.keyPair.fromSecretKey(seedBytes);
        return new Uint8Array(keyPair.publicKey);
      } catch (e) {
        console.warn('[CryptoEngine] nacl X25519 failed:', e.message);
      }
    }
    // Fallback: Web Crypto API X25519 (available in modern browsers)
    // Import the 32-byte seed as a PKCS#8-wrapped X25519 private key,
    // then re-export as JWK to extract the public key ("x" field).
    // PKCS#8 header for X25519: OID 1.3.101.110 = 302e020100300506032b656e04220420
    if (typeof crypto.subtle !== 'undefined') {
      try {
        const x25519Pkcs8Header = new Uint8Array([
        0x30, 0x2e, 0x02, 0x01, 0x00, 0x30, 0x05, 0x06, 0x03, 0x2b, 0x65, 0x6e, 0x04, 0x22, 0x04, 0x20]
        );
        const pkcs8Key = new Uint8Array(48);
        pkcs8Key.set(x25519Pkcs8Header, 0);
        pkcs8Key.set(seedBytes, 16);

        // Import as X25519 private key (must be exportable to extract public key)
        const privateKey = await crypto.subtle.importKey(
          "pkcs8",
          pkcs8Key,
          { name: "X25519" },
          true,
          ["deriveBits"]
        );

        // Export as JWK to get the public key component ("x" field)
        const jwk = await crypto.subtle.exportKey("jwk", privateKey);
        if (jwk.x) {
          // JWK "x" is base64url-encoded 32-byte Curve25519 public key
          const b64url = jwk.x;
          const b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
          const binStr = atob(b64);
          const pubBytes = new Uint8Array(binStr.length);
          for (let i = 0; i < binStr.length; i++) pubBytes[i] = binStr.charCodeAt(i);
          return pubBytes;
        }
        throw new Error('JWK export did not contain public key (x field)');
      } catch (e) {
        console.warn('[CryptoEngine] Web Crypto X25519 failed:', e.message);
      }
    }
    throw new Error('[CryptoEngine] No X25519 implementation available. ' +
    'Ensure tweetnacl (nacl-fast.min.js) is loaded, or use a browser with Web Crypto X25519 support.');
  },
  /**
   * The IPv6 address Yggdrasil's scheme assigns to a public key.
   * Private helper of deriveLegacyYggdrasilIP — see the warning there.
   * @private
   */
  async _legacyYggdrasilIPFromKey(publicKeyBytes) {
    const hashBuffer = await crypto.subtle.digest("SHA-512", publicKeyBytes);
    const hash = new Uint8Array(hashBuffer);

    let leadingOnes = 0;
    for (let i = 0; i < hash.length; i++) {
      const byte = hash[i];
      let mask = 0x80;
      while (mask > 0) {
        if ((byte & mask) !== 0) {
          leadingOnes++;
          mask >>= 1;
        } else {
          break;
        }
      }
      if (mask > 0) {
        break;
      }
    }

    const addr = new Uint8Array(16);
    addr[0] = 0x02;
    addr[1] = leadingOnes;

    let bitSrc = leadingOnes + 1;
    for (let i = 0; i < 112; i++) {
      const srcBitPos = bitSrc + i;
      const srcByteIdx = Math.floor(srcBitPos / 8);
      const srcBitIdx = 7 - srcBitPos % 8;
      const bitVal = hash[srcByteIdx] >> srcBitIdx & 1;

      const destBitPos = 16 + i;
      const destByteIdx = Math.floor(destBitPos / 8);
      const destBitIdx = 7 - destBitPos % 8;

      if (bitVal) {
        addr[destByteIdx] |= 1 << destBitIdx;
      }
    }

    const segments = [];
    for (let i = 0; i < 16; i += 2) {
      const val = addr[i] << 8 | addr[i + 1];
      segments.push(val.toString(16));
    }

    const rawIp = segments.join(':');
    const segs = rawIp.split(':');
    let bestStart = -1;
    let bestLen = 0;
    let curStart = -1;
    let curLen = 0;
    for (let i = 0; i < segs.length; i++) {
      if (parseInt(segs[i], 16) === 0) {
        if (curStart === -1) {
          curStart = i;
          curLen = 1;
        } else {
          curLen++;
        }
        if (curLen > bestLen) {
          bestStart = curStart;
          bestLen = curLen;
        }
      } else {
        curStart = -1;
        curLen = 0;
      }
    }
    if (bestLen > 1) {
      const before = segs.slice(0, bestStart).join(':');
      const after = segs.slice(bestStart + bestLen).join(':');
      return (before === '' ? '' : before) + '::' + (after === '' ? '' : after);
    }
    return rawIp;
  }
};
window.CryptoEngine = CryptoEngine;

// Identity fingerprint: truncated SHA-256 of the lower-cased raw ECDH public
// key. The single definition, used for our own and for pinned peer keys.
async function fingerprintFromPublicKey(publicKeyHex) {
  if (typeof publicKeyHex !== 'string' || !publicKeyHex.trim()) return null;
  return (await CryptoEngine.sha256(publicKeyHex.trim().toLowerCase())).slice(0, 16).toUpperCase();
}

// ==================== AT-REST VAULT KEY ====================
// Device-local secret for message blocks kept in this browser. Never leaves
// the device.
const LocalVault = {
  _key: null,
  key() {
    if (this._key) return this._key;
    let k = null;
    try {
      k = localStorage.getItem('gl_vault_key');
    } catch (e) { console.warn('[LocalVault] Failed to read vault key from storage:', e.message); }
    if (!k || k.length < 64) {
      k = Array.from(crypto.getRandomValues(new Uint8Array(32))).
      map((b) => b.toString(16).padStart(2, "0")).join("");
      try {
        localStorage.setItem('gl_vault_key', k);
      } catch (e) { console.warn('[LocalVault] Failed to persist vault key:', e.message); }
    }
    this._key = k;
    return k;
  }
};

// ==================== MESSAGE HISTORY AT REST ====================
// Message history is sealed with a key derived from the recovery phrase and
// held only in memory.
//   * unlock() refuses a key that does not open what is already stored.
//   * save() is a no-op while locked, so stored ciphertext is never clobbered.
const SECURE_STORAGE_KEYS = [MSG_STORAGE_KEY, CHAIN_STORAGE_KEY];

const MessageVault = {
  _key: null,

  isUnlocked() {return !!this._key;},
  lock() {this._key = null;},

  _hex(bytes) {return Array.from(bytes).map((b) => b.toString(16).padStart(2, "0")).join("");},
  _bytes(hex) {return new Uint8Array(hex.match(/.{2}/g).map((b) => parseInt(b, 16)));},

  async _seal(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt(
      { name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(obj))
    );
    return { __glenc: 1, iv: this._hex(iv), data: this._hex(new Uint8Array(ct)) };
  },

  async _open(key, env) {
    const pt = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: this._bytes(env.iv) }, key, this._bytes(env.data)
    );
    return JSON.parse(new TextDecoder().decode(pt));
  },

  _readRaw(storeKey) {
    try {
      const raw = localStorage.getItem(storeKey);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  },

  /**
   * Derive the storage key from the recovery phrase and verify it opens what is
   * already stored. Returns false (staying locked) on mismatch.
   * Only call this from a path where the phrase has been validated against the
   * stored identity — never from a screen that may hold a freshly generated one.
   */
  async unlock(words) {
    let key;
    try {
      key = await CryptoEngine.deriveStorageKey(words);
    } catch (e) {
      console.error('[MessageVault] storage key derivation failed:', e);
      return false;
    }
    for (const storeKey of SECURE_STORAGE_KEYS) {
      const parsed = this._readRaw(storeKey);
      if (!parsed || parsed.__glenc !== 1) continue; // absent, or not yet encrypted
      try {
        await this._open(key, parsed);
      } catch (e) {
        console.warn('[MessageVault] recovery phrase does not open stored history — staying locked');
        return false;
      }
    }
    this._key = key;
    return true;
  },

  /** → { value, state: 'empty' | 'ok' | 'locked' | 'error' | 'legacy' } */
  async load(storeKey, fallback) {
    const parsed = this._readRaw(storeKey);
    if (parsed === null) return { value: fallback, state: 'empty' };
    if (parsed.__glenc === 1) {
      if (!this._key) return { value: fallback, state: 'locked' };
      try {
        return { value: await this._open(this._key, parsed), state: 'ok' };
      } catch (e) {
        console.error('[MessageVault] failed to decrypt', storeKey, e);
        return { value: fallback, state: 'error' };
      }
    }
    // Written before at-rest encryption existed. Readable as-is; the next save
    // after unlock rewrites it sealed.
    return { value: parsed, state: 'legacy' };
  },

  // One in-flight write per store key, so a slower seal can never overwrite a
  // newer snapshot.
  _writes: {},

  save(storeKey, data) {
    if (!this._key) return Promise.resolve(false);
    const run = () => this._write(storeKey, data);
    const next = (this._writes[storeKey] || Promise.resolve()).then(run, run);
    this._writes[storeKey] = next.catch(() => {});
    return next;
  },

  async _write(storeKey, data) {
    const key = this._key;
    if (!key) return false;
    try {
      const sealed = await this._seal(key, data);
      // Locked (or re-keyed) while sealing: an account wipe must not be
      // followed by this write putting the old history back on disk.
      if (this._key !== key) return false;
      localStorage.setItem(storeKey, JSON.stringify(sealed));
      return true;
    } catch (e) {
      console.error('[MessageVault] failed to persist', storeKey, e);
      return false;
    }
  }
};

// ==================== END-TO-END MESSAGE SEALING ====================
// Every outgoing payload is sealed to the recipient's ECDH public key (ECIES via
// CryptoEngine.encryptWithPublicKey). Never send the plaintext alongside it.
async function sealPayload(payloadObj, recipientPubKeyHex) {
  if (!recipientPubKeyHex) throw new Error('Recipient public key unknown');
  return CryptoEngine.encryptWithPublicKey(JSON.stringify(payloadObj), recipientPubKeyHex);
}

async function unsealPayload(sealed, identity) {
  const privKey = identity?.keyPair?.privateKey || identity?.privateKey;
  if (!privKey) throw new Error('Private key unavailable — unlock your identity first');
  return JSON.parse(await CryptoEngine.decryptWithPrivateKey(sealed, privKey));
}

// ==================== INBOUND PAYLOAD SHAPING ====================
// Sealed payloads are still peer-authored JSON, so every field is coerced to
// the shape our own senders produce before it is rendered or persisted.
const INBOUND_MSG_TYPES = ['text', 'file', 'image'];
const INBOUND_NAME_MAX = 64;
const INBOUND_WAVEFORM_MAX = 12000; // 10 minutes at the recorder's 20 samples/s
const REACTION_EMOJIS = ['❤️', '👍', '👎', '😂', '😮', '😢', '🔥', '✅', '⚠️'];

const inboundStr = (v, max) => typeof v === 'string' ? v.slice(0, max) : undefined;
const inboundNum = (v) => typeof v === 'number' && Number.isFinite(v) && v >= 0 ? v : undefined;

// A peer's display name, never allowed to equal ours: the message list decides
// which side a bubble is drawn on by comparing sender to our own name, so a
// peer naming itself after us had its messages rendered as ones we wrote.
function inboundSenderName(v, selfName) {
  const name = inboundStr(v, INBOUND_NAME_MAX) || 'Peer';
  return selfName && name === selfName ? `${name} (peer)` : name;
}

function sanitizeInboundChat(inner, selfName) {
  const src = inner && typeof inner === 'object' ? inner : {};
  const m = src.meta && typeof src.meta === 'object' && !Array.isArray(src.meta) ? src.meta : {};
  const meta = {};
  if (inboundNum(m.fileSize) !== undefined) meta.fileSize = m.fileSize;
  if (inboundNum(m.chunks) !== undefined) meta.chunks = Math.floor(m.chunks);
  if (inboundStr(m.hash, 128) !== undefined) meta.hash = inboundStr(m.hash, 128);
  if (inboundStr(m.fileName, 255) !== undefined) meta.fileName = inboundStr(m.fileName, 255);
  if (inboundNum(m.selfDestruct) !== undefined) meta.selfDestruct = m.selfDestruct;
  if (typeof m.imageData === 'string' && /^[A-Za-z0-9+/]*={0,2}$/.test(m.imageData)) meta.imageData = m.imageData;
  if (typeof m.mimeType === 'string' && /^image\/[a-z0-9.+-]+$/i.test(m.mimeType)) meta.mimeType = m.mimeType;
  if (m.replyTo && typeof m.replyTo === 'object') {
    meta.replyTo = {
      index: inboundNum(m.replyTo.index) ?? 0,
      sender: inboundStr(m.replyTo.sender, INBOUND_NAME_MAX) || '',
      preview: inboundStr(m.replyTo.preview, 60) || ''
    };
  }
  return {
    content: typeof src.content === 'string' ? src.content : '',
    msgType: INBOUND_MSG_TYPES.includes(src.msgType) ? src.msgType : 'text',
    meta,
    sender: inboundSenderName(src.sender, selfName)
  };
}

// Voice notes carry their audio inline. A peer-supplied `url` is never used:
// it went straight into `new Audio(url)`, so pressing play fetched whatever
// address the peer chose — handing them this device's IP and the moment the
// note was played.
function sanitizeInboundVoice(v, selfName) {
  if (!v || typeof v !== 'object' || typeof v.audioData !== 'string' || !v.audioData) return null;
  const waveform = Array.isArray(v.waveform) ?
  v.waveform.slice(0, INBOUND_WAVEFORM_MAX).map((a) => typeof a === 'number' && Number.isFinite(a) ? Math.min(1, Math.max(0, a)) : 0) :
  [];
  return {
    audioData: v.audioData,
    mimeType: typeof v.mimeType === 'string' && /^audio\/[a-z0-9.+-]+$/i.test(v.mimeType) ? v.mimeType : 'audio/webm',
    duration: inboundNum(v.duration) ?? 0,
    waveform,
    ts: inboundNum(v.ts) ?? Date.now(),
    sender: inboundSenderName(v.sender, selfName)
  };
}

// Record a peer's reaction. Only emoji from our own picker are accepted, and
// only against a message hash we hold: an arbitrary emoji string such as
// "toString" or "__proto__" resolved to an inherited property, whose missing
// .includes threw inside the state updater and crashed the app.
function applyInboundReaction(prev, messageHash, emoji, reactorId) {
  if (typeof messageHash !== 'string' || !messageHash) return prev;
  if (typeof emoji !== 'string' || !REACTION_EMOJIS.includes(emoji)) return prev;
  const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const existing = own(prev, messageHash) ? prev[messageHash] : {};
  const reactors = own(existing, emoji) && Array.isArray(existing[emoji]) ? existing[emoji] : [];
  if (reactors.includes(reactorId)) return prev;
  return { ...prev, [messageHash]: { ...existing, [emoji]: [...reactors, reactorId] } };
}

// ==================== PUBLIC-KEY PINNING ====================
// A peer's announced ECDH key is pinned only after it proves it holds the
// private half: it must open a nonce sealed to that key. The challenge names
// both ends of the link, so it cannot be relayed to the real key holder.
const PINNABLE_KEY = /^04[0-9a-f]{128}$/; // raw uncompressed P-256, as exportKey('raw') produces

function createKeyPinning({ seal, unseal, selfIds, send, getPinned, pin, randomHex }) {
  const pending = new Map(); // transport peer id -> { key, nonce, name }
  return {
    // → 'invalid' | 'mismatch' | 'known' | 'challenged'
    async onAnnounce(peerId, msg) {
      const key = typeof msg?.publicKeyHex === 'string' ? msg.publicKeyHex.trim().toLowerCase() : '';
      if (!PINNABLE_KEY.test(key)) return 'invalid';
      const known = getPinned(peerId)?.toLowerCase() || null;
      if (known) return known === key ? 'known' : 'mismatch';
      const nonce = randomHex(16);
      pending.set(peerId, { key, nonce, name: inboundStr(msg.name, INBOUND_NAME_MAX) || '' });
      send(peerId, {
        type: 'key-challenge',
        sealed: await seal({ nonce, target: peerId, challenger: selfIds() }, key)
      });
      return 'challenged';
    },
    // Answer a challenge sent to our own key. → true if answered.
    async onChallenge(peerId, msg) {
      let c;
      try {c = await unseal(msg?.sealed);} catch (e) {return false;}
      if (!c || typeof c.nonce !== 'string' || c.nonce.length > 128) return false;
      if (!selfIds().includes(c.target)) return false;
      if (!Array.isArray(c.challenger) || !c.challenger.includes(peerId)) return false;
      send(peerId, { type: 'key-proof', nonce: c.nonce });
      return true;
    },
    // → the pinned key, or null.
    onProof(peerId, msg) {
      const p = pending.get(peerId);
      if (!p || typeof msg?.nonce !== 'string' || msg.nonce !== p.nonce) return null;
      pending.delete(peerId);
      const known = getPinned(peerId)?.toLowerCase() || null;
      if (known && known !== p.key) return null;
      pin(peerId, p.key, p.name);
      return p.key;
    }
  };
}

// The Ghost Address in a scanned QR. Our own codes are JSON with the address in
// `c`; a bare address (screenshot, paper) is accepted too.
function ghostAddressFromScan(data) {
  if (typeof data !== 'string') return null;
  try {
    const parsed = JSON.parse(data);
    if (parsed && typeof parsed === 'object') return normalizeGhostAddress(parsed.c ?? parsed.code);
  } catch (e) {/* not JSON: fall through to a bare address */}
  return normalizeGhostAddress(data);
}

// ==================== PEER CACHE (localStorage) ====================
const PeerCache = {
  KEY: 'gl_peer_cache',
  load() {try {return JSON.parse(localStorage.getItem(this.KEY) || '{}');} catch {return {};}},
  save(cache) {localStorage.setItem(this.KEY, JSON.stringify(cache));},
  addPeer(peerId, info) {
    const cache = this.load();
    cache[peerId] = { ...cache[peerId], ...info, lastSeen: Date.now() };
    this.save(cache);
  },
  getPeer(peerId) {return this.load()[peerId] || null;},
  // The manual-signaling flows historically wrote the key as `pubKeyHex` while
  // everything else uses `publicKeyHex`. Read both so caches written by either
  // path — including ones already on disk — still resolve.
  getPublicKey(peerId) {
    const p = this.load()[peerId];
    return p?.publicKeyHex || p?.pubKeyHex || null;
  },
  removePeer(peerId) {const c = this.load();delete c[peerId];this.save(c);},
  getAllPeers() {return this.load();}
};

// ==================== SHAMIR SECRET SHARING (GF-256) ====================
const ShamirSSS = (() => {
  const GF_EXP = new Uint8Array(512);
  const GF_LOG = new Uint8Array(256);
  (function buildTables() {
    let x = 1;
    for (let i = 0; i < 255; i++) {
      GF_EXP[i] = x;GF_LOG[x] = i;
      x ^= x << 1 ^ (x & 0x80 ? 0x1B : 0);
      x &= 0xFF;
    }
    for (let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
    GF_LOG[0] = 0;
  })();
  function gfMul(a, b) {if (a === 0 || b === 0) return 0;return GF_EXP[GF_LOG[a] + GF_LOG[b]];}
  function gfDiv(a, b) {if (b === 0) throw new RangeError("GF division by zero");if (a === 0) return 0;return GF_EXP[(GF_LOG[a] - GF_LOG[b] + 255) % 255];}
  function polyEval(coeffs, x) {let result = 0;for (let i = coeffs.length - 1; i >= 0; i--) result = gfMul(result, x) ^ coeffs[i];return result;}
  return {
    split(secret, n, k) {
      const shares = Array.from({ length: n }, (_, i) => ({ x: i + 1, y: new Uint8Array(secret.length) }));
      const coeffs = new Uint8Array(k);
      for (let b = 0; b < secret.length; b++) {
        coeffs[0] = secret[b];
        for (let j = 1; j < k; j++) coeffs[j] = crypto.getRandomValues(new Uint8Array(1))[0];
        shares.forEach((s) => {s.y[b] = polyEval(Array.from(coeffs), s.x);});
      }
      coeffs.fill(0);
      return shares;
    },
    combine(shares) {
      const len = shares[0].y.length;
      const k = shares.length;
      const secret = new Uint8Array(len);
      for (let b = 0; b < len; b++) {
        for (let i = 0; i < k; i++) {
          let num = 1,den = 1;
          for (let j = 0; j < k; j++) {
            if (i === j) continue;
            num = gfMul(num, shares[j].x);
            den = gfMul(den, shares[i].x ^ shares[j].x);
          }
          secret[b] ^= gfMul(shares[i].y[b], gfDiv(num, den));
        }
      }
      return secret;
    }
  };
})();

// ==================== BLOCKCHAIN ====================
const GENESIS_PREV_HASH = "0".repeat(64);

class Chain {
  constructor() {this.blocks = [];}

  // The canonical record a block's hash commits to. Every block — locally
  // authored or received from a peer — is hashed over exactly this, so a single
  // definition is what makes verify() able to check all of them.
  static record(block) {
    return JSON.stringify({
      sender: block.sender, content: block.content,
      type: block.type, ts: block.ts, meta: block.meta || {}
    });
  }
  static hashFor(prevHash, block) {
    return CryptoEngine.sha256(prevHash + Chain.record(block) + block.ts);
  }

  async add(sender, content, type = "text", meta = {}) {
    const prev = this.blocks.length ? this.blocks[this.blocks.length - 1].hash : GENESIS_PREV_HASH;
    const ts = Date.now();
    const block = { index: this.blocks.length, ts, sender, content, type, meta, prevHash: prev, nonce: Math.floor(Math.random() * 999999) };
    block.hash = await Chain.hashFor(prev, block);
    this.blocks.push(block);
    return block;
  }

  // Verify every block, genesis and inbound included. Inbound blocks are hashed
  // locally; the sender's hash is kept separately as `remoteHash`.
  async verify() {
    for (let i = 0; i < this.blocks.length; i++) {
      const curr = this.blocks[i];
      const expectedPrev = i === 0 ? GENESIS_PREV_HASH : this.blocks[i - 1].hash;
      if (curr.prevHash !== expectedPrev) return false;
      if (curr.hash !== (await Chain.hashFor(expectedPrev, curr))) return false;
    }
    return true;
  }

  // Migration: older chains stored the sender's hash in `hash` for inbound
  // blocks. Move it to `remoteHash` and re-link from there. Tamper resistance
  // at rest comes from the vault's AEAD, not from these hashes.
  async relinkLegacyBlocks() {
    let firstLegacy = -1;
    for (let i = 0; i < this.blocks.length; i++) {
      const b = this.blocks[i];
      if (b.isReceived && b.remoteHash === undefined) {firstLegacy = i;break;}
    }
    if (firstLegacy === -1) return false;

    for (let i = firstLegacy; i < this.blocks.length; i++) {
      const b = this.blocks[i];
      if (b.isReceived && b.remoteHash === undefined) b.remoteHash = b.hash;
      b.prevHash = i === 0 ? GENESIS_PREV_HASH : this.blocks[i - 1].hash;
      b.hash = await Chain.hashFor(b.prevHash, b);
    }
    return true;
  }

  // Erase a block's body in place and re-link every block after it, so the
  // content leaves exports and the vault while verify() still passes.
  // Returns oldHash → newHash for every block whose hash moved.
  async destroyBlock(hash) {
    const start = this.blocks.findIndex((b) => b.hash === hash);
    if (start === -1) return null;

    const target = this.blocks[start];
    target.content = '';
    target.destroyed = true;
    target.destroyedAt = Date.now();
    delete target.encrypted;

    const remap = new Map();
    for (let i = start; i < this.blocks.length; i++) {
      const b = this.blocks[i];
      const oldHash = b.hash;
      b.prevHash = i === 0 ? GENESIS_PREV_HASH : this.blocks[i - 1].hash;
      b.hash = await Chain.hashFor(b.prevHash, b);
      if (oldHash !== b.hash) remap.set(oldHash, b.hash);
    }
    return remap;
  }

  export() {return JSON.stringify(this.blocks, null, 2);}
}

// ==================== RECOVERY HELPERS ====================

// Build the full data blob that gets Shamir-split
async function buildBackupBlob(identity, masterKey, appState) {
  const wrappedPrivKey = await CryptoEngine.wrapPrivKey(identity.keyPair.privateKey, masterKey);
  const blob = {
    version: 1,
    timestamp: Date.now(),
    name: identity.name,
    pubKeyHex: identity.publicKeyHex,
    fingerprint: identity.fingerprint,
    wrappedPrivKey,
    messages: appState.messages || {},
    contacts: appState.contacts || [],
    settings: appState.settings || {},
    chain: appState.chain || [],
    files: appState.files || []
  };
  return JSON.stringify(blob);
}

// Split a blob string into 7 Shamir fragments (threshold: 3)
// Fragment encoding: first byte = x-coordinate, rest = y-values (self-describing)
function generateBackupFragments(blobStr) {
  const dataBytes = new TextEncoder().encode(blobStr);
  const shares = ShamirSSS.split(dataBytes, 7, 3);
  const fragments = shares.map((share) => {
    const encoded = [share.x, ...share.y].map((b) => b.toString(16).padStart(2, '0')).join('');
    return {
      id: share.x,
      label: `Fragment ${share.x} of 7`,
      data: encoded,
      check: encoded.slice(0, 8),
      distributed: false,
      peerName: '',
      peerId: ''
    };
  });
  localStorage.setItem('gl_fragment_meta', JSON.stringify(
    fragments.map((f) => ({ id: f.id, check: f.check, distributed: f.distributed, peerName: f.peerName, peerId: f.peerId }))
  ));
  return fragments;
}

// Mark a fragment as distributed to a named peer. peerId identifies the holder
// for the "one fragment per recipient" rule — three shares reconstruct the
// backup, so the same peer must never accumulate more than one. It is empty for
// fragments handed over out-of-band, where there is nobody to identify.
function markFragmentDistributed(fragmentId, peerName, peerId = '') {
  const meta = JSON.parse(localStorage.getItem('gl_fragment_meta') || '[]');
  const frag = meta.find((f) => f.id === fragmentId);
  if (frag) {frag.distributed = true;frag.peerName = peerName;frag.peerId = peerId;}
  localStorage.setItem('gl_fragment_meta', JSON.stringify(meta));
  return meta;
}

// Get current distribution status
function getFragmentStatus() {
  const meta = JSON.parse(localStorage.getItem('gl_fragment_meta') || '[]');
  const distributed = meta.filter((f) => f.distributed).length;
  return { total: 7, threshold: 3, distributed, safe: distributed >= 3, fragments: meta };
}

// Combine ≥3 fragment hex strings and unwrap identity using master key
async function combineAndRestore(masterKey, fragmentHexArray) {
  if (fragmentHexArray.length < 3) return { success: false, error: `Need at least 3 fragments, got ${fragmentHexArray.length}` };
  let shares;
  try {
    shares = fragmentHexArray.map((hex) => {
      const bytes = hex.trim().match(/.{2}/g).map((b) => parseInt(b, 16));
      return { x: bytes[0], y: new Uint8Array(bytes.slice(1)) };
    });
  } catch (e) {return { success: false, error: 'Invalid fragment format' };}

  let blob;
  try {
    const reconstructed = ShamirSSS.combine(shares);
    blob = JSON.parse(new TextDecoder().decode(reconstructed));
  } catch (e) {return { success: false, error: 'Fragment reconstruction failed — wrong or corrupted fragments' };}

  let privKey;
  try {
    privKey = await CryptoEngine.unwrapPrivKey(blob.wrappedPrivKey, masterKey);
  } catch (e) {return { success: false, error: 'Key unwrap failed — wrong seed phrase' };}

  const pubKeyBytes = new Uint8Array(blob.pubKeyHex.match(/.{2}/g).map((b) => parseInt(b, 16)));
  const pubKey = await crypto.subtle.importKey('raw', pubKeyBytes, { name: 'ECDH', namedCurve: 'P-256' }, true, []);

  const identity = {
    keyPair: { privateKey: privKey, publicKey: pubKey },
    publicKeyHex: blob.pubKeyHex,
    fingerprint: blob.fingerprint,
    name: blob.name
  };

  // Restore app state to localStorage. Messages and chain are deliberately NOT
  // written here: those are vault-managed, and writing them as plaintext would
  // both leak the recovered history and clobber the sealed store. They are
  // handed back to the caller, which seals them once the vault is unlocked.
  if (blob.settings) localStorage.setItem('gl_settings', JSON.stringify(blob.settings));
  localStorage.setItem('gl_identity', JSON.stringify({
    name: blob.name, pubKeyHex: blob.pubKeyHex, fingerprint: blob.fingerprint, wrappedPrivKey: blob.wrappedPrivKey
  }));

  return {
    success: true,
    identity,
    recovered: { messages: blob.messages || null, chain: blob.chain || null },
    restored: { messages: !!blob.messages, settings: !!blob.settings, chain: !!blob.chain }
  };
}

// ==================== MESH TROUBLE NOTICE ====================
// Distinct banners for distinct failures, each naming its fix.
const MESH_TROUBLE = {
  'bridge-down': {
    title: 'Ghost Mesh bridge not running',
    body: html`Nothing is listening on the bridge port, so this app has no mesh node to
      talk to. Peers already connected directly are unaffected. Start it with
      <code>npm start</code> in the project root (the desktop app starts it for you),
      then this notice clears on its own.`
  },
  'no-public-peers-configured': {
    title: 'No public peer configured',
    body: html`The bridge is running and the mesh is up, but the bootstrap list is empty,
      so there is nobody to ask for an address on the wider internet. Peers on your own
      network are still found automatically. Run a peer
      (<code>node gmp-core/test/run-public-peer.js</code>) and list it in
      <code>gmp-core/data/public-peers.json</code>, or point
      <code>GMP_PUBLIC_PEERS_PATH</code> at your own list.`
  },
  'peers-unreachable': {

    body: html`The bootstrap peer is configured but the connection never got through — the

  },

    body: html`The bootstrap peer accepted the TCP connection but never completed the GMP

  },
  'unknown': {
    title: 'Mesh bootstrap did not complete',
